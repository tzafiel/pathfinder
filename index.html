  /* ==========================================================================
     8. GUIDED 6-STEP BRANCHING BUBBLE WIZARD
     ========================================================================== */
  function renderWizardScreen() {
    const d = ui.wizardDraft;
    const isCouple = d.household.type === 'couple';
    const step = ui.wizardStep;
    const stepTitles = [
      'Household, Cadence & Tax Region',
      'Income Streams',
      'Credit Orbs & Fall-Off Boosts',
      'Recurring Bills & Living Expenses',
      'Starting Cash & Debt Ledger',
      'Multi-Goal Stack & Strategy'
    ];

    let bodyHtml = '';

    if (step === 1) {
      bodyHtml = `
        <div class="choice-orb-grid" style="margin-bottom:14px;">
          <button class="choice-orb ${!isCouple ? 'selected' : ''}" onclick="PF.wizSetType('single')">
            <div style="font-size:20px;color:var(--cyan);margin-bottom:6px;">●</div>
            <h3 style="font-size:15.5px;">Single Household</h3>
            <p style="font-size:12px;color:var(--text-2);margin-top:4px;">One earner, one Credit Orb, solo underwriting.</p>
          </button>
          <button class="choice-orb ${isCouple ? 'selected' : ''}" onclick="PF.wizSetType('couple')">
            <div style="font-size:20px;color:var(--violet);margin-bottom:6px;">●●</div>
            <h3 style="font-size:15.5px;">Couple / Dual</h3>
            <p style="font-size:12px;color:var(--text-2);margin-top:4px;">Two incomes, two Credit Orbs, Joint vs. Solo mortgage math.</p>
          </button>
        </div>

        <div class="grid-2" style="margin-bottom:12px;">
          <div class="field"><label>Blueprint Name</label><input class="input" value="${esc(d.household.label)}" placeholder="e.g., My 2027 Home Plan" oninput="PF.wizDraft().household.label=this.value" /></div>
          <div class="field"><label>Next Payday Date</label><input class="input" type="date" value="${esc(d.household.nextPayday)}" oninput="PF.wizDraft().household.nextPayday=this.value" /></div>
          <div class="field"><label>${isCouple ? 'Partner A Name' : 'Your First Name'}</label><input class="input" value="${esc(d.partnerA.name)}" oninput="PF.wizDraft().partnerA.name=this.value" /></div>
          ${isCouple ? `<div class="field"><label>Partner B Name</label><input class="input" value="${esc(d.partnerB.name)}" oninput="PF.wizDraft().partnerB.name=this.value" /></div>` : ''}
        </div>

        <div class="field" style="margin-bottom:14px;">
          <label>Payday Check-In Cadence</label>
          <div class="chip-group">
            ${Object.entries(CADENCE_LABELS).map(([k, lbl]) => `
              <button class="chip-btn ${d.household.cadence === k ? 'active' : ''}" onclick="PF.wizSetCadence('${k}')">${lbl}</button>
            `).join('')}
          </div>
        </div>

        <div class="sub-bubble">
          <strong style="font-size:13px;">Regional Tax &amp; USDA Preset</strong>
          <div class="chip-group">
            ${Object.values(REGION_PRESETS).map(r => `
              <button class="chip-btn ${d.household.regionPreset===r.key?'active':''}" onclick="PF.wizSetRegion('${r.key}')">${r.label}</button>
            `).join('')}
          </div>
          <div class="grid-2-keep">
            <div class="field"><label>Est. Total Eff. Tax (%)</label><input class="input tabular" inputmode="decimal" type="number" min="0" max="45" step="0.5" value="${num(d.household.effTaxPct)}" oninput="PF.wizRegionNum('effTaxPct',this.value)" /></div>
            <div class="field"><label>Local Property Tax (%/yr)</label><input class="input tabular" inputmode="decimal" type="number" min="0" max="4" step="0.05" value="${num(d.household.propTaxPct)}" oninput="PF.wizRegionNum('propTaxPct',this.value)" /></div>
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);cursor:pointer;">
            <input type="checkbox" ${d.household.usdaEligible ? 'checked' : ''} onchange="PF.wizDraft().household.usdaEligible=this.checked" />
            Target area is USDA Rural Eligible (unlocks 0% down USDA loans)
          </label>
        </div>
      `;
    } else if (step === 2) {
      const renderIncCard = (pKey, cls) => {
        const p = d[pKey];
        const c = calcPartnerIncome(p, d.household.effTaxPct);
        return `
          <div class="sub-bubble ${cls}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <strong>${esc(p.name)}'s Income</strong>
              <span class="pill pill-emerald tabular">Net: ${fmtMoney(c.netMonthly)}/mo · Gross: ${fmtMoney(c.grossMonthly)}</span>
            </div>
            <div class="chip-group">
              <button class="chip-btn ${p.incomeMode==='hourly'?'active':''}" onclick="PF.wizIncMode('${pKey}','hourly')">Hourly</button>
              <button class="chip-btn ${p.incomeMode==='annual'?'active':''}" onclick="PF.wizIncMode('${pKey}','annual')">Annual Salary</button>
              <button class="chip-btn ${p.incomeMode==='net'?'active':''}" onclick="PF.wizIncMode('${pKey}','net')">Monthly Net Override</button>
            </div>
            ${p.incomeMode === 'hourly' ? `
              <div class="grid-2-keep">
                <div class="field"><label>Hourly Rate ($/hr)</label><input class="input tabular" inputmode="decimal" type="number" step="0.5" value="${num(p.hourlyRate)}" oninput="PF.wizIncVal('${pKey}','hourlyRate',this.value)" /></div>
                <div class="field"><label>Hours / Week</label><input class="input tabular" inputmode="decimal" type="number" step="1" value="${num(p.hoursPerWeek,40)}" oninput="PF.wizIncVal('${pKey}','hoursPerWeek',this.value)" /></div>
              </div>
            ` : p.incomeMode === 'annual' ? `
              <div class="field"><label>Annual Gross Salary ($/yr)</label><input class="input tabular" inputmode="numeric" type="number" step="1000" value="${num(p.annualSalary)}" oninput="PF.wizIncVal('${pKey}','annualSalary',this.value)" /></div>
            ` : `
              <div class="field"><label>Monthly Net Take-Home ($/mo)</label><input class="input tabular" inputmode="numeric" type="number" step="50" value="${num(p.monthlyNet)}" oninput="PF.wizIncVal('${pKey}','monthlyNet',this.value)" /></div>
            `}
          </div>
        `;
      };

      bodyHtml = `
        <div class="${isCouple ? 'grid-2' : ''}" style="display:grid;gap:12px;">
          ${renderIncCard('partnerA', 'cyan-rim')}
          ${isCouple ? renderIncCard('partnerB', 'violet-rim') : ''}
        </div>
      `;
    } else if (step === 3) {
      const renderCreditCard = (pKey, cls) => {
        const p = d[pKey];
        const sc = clamp(num(p.fico, 660), 300, 850);
        const boost = Math.max(0, num(p.milestoneBoost, 50));
        const proj = clamp(sc + boost, 300, 850);
        const meta = ficoMeta(sc);
        const pct = ((sc - 300) / 550) * 100;
        return `
          <div class="credit-orb-box ${cls}">
            <strong>${esc(p.name)}'s Credit Orb</strong>
            <div class="gauge-wrap">
              ${ringSvg(pct, meta.color, 112, 7)}
              <div style="position:relative;z-index:2;">
                <div class="tabular" style="font-size:28px;font-weight:800;color:${meta.color};line-height:1;">${sc}</div>
                <div style="font-size:10px;font-weight:700;color:var(--text-2);margin-top:3px;text-transform:uppercase;">${meta.label}</div>
              </div>
            </div>
            <input class="orb-slider ${pKey==='partnerB'?'violet':''}" type="range" min="300" max="850" step="5" value="${sc}" oninput="PF.wizCredit('${pKey}','fico',parseInt(this.value))" />
            <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;width:100%;cursor:pointer;">
              <input type="checkbox" ${p.hasMilestone?'checked':''} onchange="PF.wizCredit('${pKey}','hasMilestone',this.checked)" />
              Derogatory Fall-Off Date + Point Boost?
            </label>
            ${p.hasMilestone ? `
              <div class="grid-2-keep" style="width:100%;text-align:left;">
                <div class="field"><label>Fall-Off Month</label><input class="input" type="month" value="${esc(p.milestoneDate)}" oninput="PF.wizDraft()['${pKey}'].milestoneDate=this.value" /></div>
                <div class="field"><label>Boost (+pts → ${proj})</label><input class="input tabular" type="number" min="5" max="250" step="5" value="${boost}" oninput="PF.wizCredit('${pKey}','milestoneBoost',parseInt(this.value)||0)" /></div>
              </div>
            ` : ''}
          </div>
        `;
      };

      bodyHtml = `
        <div class="${isCouple ? 'grid-2' : ''}" style="display:grid;gap:14px;">
          ${renderCreditCard('partnerA', 'cyan-rim')}
          ${isCouple ? renderCreditCard('partnerB', 'violet-rim') : ''}
        </div>
        ${isCouple ? `
          <div class="sub-bubble violet-rim" style="margin-top:12px;font-size:12.5px;color:var(--text-2);">
            <strong style="color:var(--violet);">Dual-Borrower Smart Engine:</strong> Joint mortgages qualify using the lower score (${Math.min(num(d.partnerA.fico), num(d.partnerB.fico))}). Pathfinder automatically evaluates Joint vs. ${esc(d.partnerA.name)} Solo vs. ${esc(d.partnerB.name)} Solo.
          </div>
        ` : ''}
      `;
    } else if (step === 4) {
      const ex = d.expenses;
      const bSum = summarizeBills(d);
      const incA = calcPartnerIncome(d.partnerA, d.household.effTaxPct).netMonthly;
      const incB = isCouple ? calcPartnerIncome(d.partnerB, d.household.effTaxPct).netMonthly : 0;
      const dMins = (d.debts || []).reduce((s, x) => s + num(x.minPayment), 0);
      const varLiving = num(ex.groceries) + num(ex.transport) + num(ex.misc);
      const surp = (incA + incB) - bSum.total - varLiving - num(ex.leakage) - dMins;

      bodyHtml = `
        <div class="sub-bubble ${surp >= 0 ? 'emerald-rim' : 'rose-rim'}" style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;">
            <span style="font-size:11.5px;font-weight:700;color:var(--text-2);">LIVE MONTHLY SURPLUS (AUTO-SYNCED)</span>
            <strong class="tabular" id="wiz-surplus-val" style="font-size:21px;color:${surp >= 0 ? 'var(--emerald)' : 'var(--rose)'};">${fmtMoney(surp)}/mo</strong>
          </div>
          <div class="tabular" id="wiz-surplus-sub" style="font-size:11.5px;color:var(--text-2);">
            Net ${fmtMoney(incA + incB)} − Bills ${fmtMoney(bSum.total)} − Living ${fmtMoney(varLiving)} − Leakage ${fmtMoney(ex.leakage)}
          </div>
        </div>

        <!-- Recurring Bills List -->
        <div class="sub-bubble cyan-rim" style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <div>
              <strong>Recurring Bills (${fmtMoney(bSum.total)}/mo)</strong>
              <div style="font-size:11px;color:var(--text-2);" class="tabular">1st–15th: ${fmtMoney(bSum.firstTotal)} · 16th–End: ${fmtMoney(bSum.secondTotal)} (No double-counting)</div>
            </div>
            <button class="btn btn-sm btn-cyan" onclick="PF.wizAddBill()">+ Add Bill</button>
          </div>
          ${d.bills.map((b, idx) => `
            <div style="padding:10px;border-radius:16px;background:rgba(6,10,20,0.62);border:1px solid var(--glass-border);display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;gap:8px;">
                <input class="input" value="${esc(b.name)}" placeholder="Bill Name" oninput="PF.wizBillEdit(${idx},'name',this.value)" />
                <button class="btn btn-sm btn-danger" onclick="PF.wizDelBill(${idx})">✕</button>
              </div>
              <div class="grid-2-keep">
                <div class="field"><label>Amount ($/mo)</label><input class="input tabular" inputmode="numeric" type="number" min="0" step="5" value="${num(b.amount)}" oninput="PF.wizBillEdit(${idx},'amount',parseFloat(this.value)||0)" /></div>
                <div class="field"><label>Due Day (1–31)</label><input class="input tabular" inputmode="numeric" type="number" min="1" max="31" value="${num(b.dueDay,1)}" oninput="PF.wizBillEdit(${idx},'dueDay',clampDay(this.value))" /></div>
              </div>
              <div class="chip-group">
                <button class="chip-btn ${b.autopay?'active':''}" style="min-height:34px;padding:4px 11px;font-size:11.5px;" onclick="PF.wizBillToggle(${idx},'autopay')">${b.autopay ? '✓ Autopay' : 'Manual Pay'}</button>
                <button class="chip-btn ${b.cuttable?'active':''}" style="min-height:34px;padding:4px 11px;font-size:11.5px;" onclick="PF.wizBillToggle(${idx},'cuttable')">${b.cuttable ? '✂ Subscription / Cuttable' : 'Essential'}</button>
                <button class="chip-btn ${isBillHousing(b)?'active':''}" style="min-height:34px;padding:4px 11px;font-size:11.5px;" onclick="PF.wizBillToggle(${idx},'isHousing')">${isBillHousing(b) ? '🏠 Rent/Housing' : 'Mark Housing'}</button>
              </div>
            </div>
          `).join('') || '<div style="font-size:12px;color:var(--text-3);">No recurring bills added yet. Tap + Add Bill.</div>'}
        </div>

        <!-- Variable Living Expenses -->
        <div class="grid-3" style="margin-bottom:12px;">
          <div class="field"><label>Groceries ($/mo)</label><input class="input tabular" inputmode="numeric" type="number" step="25" value="${num(ex.groceries)}" oninput="PF.wizExp('groceries',this.value)" /></div>
          <div class="field"><label>Gas / Transit ($/mo)</label><input class="input tabular" inputmode="numeric" type="number" step="20" value="${num(ex.transport)}" oninput="PF.wizExp('transport',this.value)" /></div>
          <div class="field"><label>Household Misc ($/mo)</label><input class="input tabular" inputmode="numeric" type="number" step="20" value="${num(ex.misc)}" oninput="PF.wizExp('misc',this.value)" /></div>
        </div>

        <div class="sub-bubble amber-rim">
          <strong style="color:var(--amber);">Lifestyle Leakage (Dining Out, Impulse, Fun)</strong>
          <input class="input tabular" inputmode="numeric" type="number" step="25" value="${num(ex.leakage)}" oninput="PF.wizExp('leakage',this.value)" />
        </div>
      `;
    } else if (step === 5) {
      bodyHtml = `
        <div class="sub-bubble cyan-rim" style="margin-bottom:12px;">
          <strong>Starting Cash Savings &amp; HYSA Yield</strong>
          <div class="grid-2-keep">
            <div class="field"><label>Current Cash Saved ($)</label><input class="input tabular" inputmode="numeric" type="number" step="250" value="${num(d.cash.liquid)}" oninput="PF.wizDraft().cash.liquid=parseFloat(this.value)||0" /></div>
            <div class="field"><label>HYSA APY (%)</label><input class="input tabular" inputmode="decimal" type="number" min="0" max="12" step="0.1" value="${num(d.cash.hysaApy,4.25)}" oninput="PF.wizDraft().cash.hysaApy=parseFloat(this.value)||0" /></div>
          </div>
        </div>

        <div class="sub-bubble" style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <strong>Debt Ledger (${d.debts.length})</strong>
            <button class="btn btn-sm btn-cyan" onclick="PF.wizAddDebt()">+ Add Debt</button>
          </div>
          ${d.debts.map((dbt, idx) => `
            <div style="padding:11px;border-radius:16px;background:rgba(6,10,20,0.62);border:1px solid var(--glass-border);display:flex;flex-direction:column;gap:8px;">
              <div style="display:flex;gap:8px;">
                <input class="input" value="${esc(dbt.name)}" oninput="PF.wizDraft().debts[${idx}].name=this.value" />
                <button class="btn btn-sm btn-danger" onclick="PF.wizDelDebt(${idx})">✕</button>
              </div>
              <div class="grid-3">
                <div class="field"><label>Balance ($)</label><input class="input tabular" inputmode="numeric" type="number" step="100" value="${num(dbt.balance)}" oninput="PF.wizDraft().debts[${idx}].balance=parseFloat(this.value)||0" /></div>
                <div class="field"><label>APR (%)</label><input class="input tabular" inputmode="decimal" type="number" step="0.1" value="${num(dbt.apr)}" oninput="PF.wizDraft().debts[${idx}].apr=parseFloat(this.value)||0" /></div>
                <div class="field"><label>Min / Mo ($)</label><input class="input tabular" inputmode="numeric" type="number" step="10" value="${num(dbt.minPayment)}" oninput="PF.wizDraft().debts[${idx}].minPayment=parseFloat(this.value)||0" /></div>
              </div>
              ${isCouple ? `
                <div class="field">
                  <label>Owner Tag</label>
                  <select class="select" onchange="PF.wizDraft().debts[${idx}].owner=this.value">
                    <option value="partnerA" ${dbt.owner==='partnerA'?'selected':''}>${esc(d.partnerA.name)}</option>
                    <option value="partnerB" ${dbt.owner==='partnerB'?'selected':''}>${esc(d.partnerB.name)}</option>
                    <option value="joint" ${dbt.owner==='joint'?'selected':''}>Joint</option>
                  </select>
                </div>
              ` : ''}
            </div>
          `).join('') || '<div style="font-size:12.5px;color:var(--text-3);">Debt-free? Leave empty or tap + Add Debt.</div>'}
        </div>

        <div class="field">
          <label>Payoff Strategy</label>
          <div class="chip-group">
            <button class="chip-btn ${d.debtStrategy==='dti_optimizer'?'active':''}" onclick="PF.wizSetDebtStrat('dti_optimizer')">DTI Optimizer</button>
            <button class="chip-btn ${d.debtStrategy==='avalanche'?'active':''}" onclick="PF.wizSetDebtStrat('avalanche')">Avalanche (Highest APR)</button>
            <button class="chip-btn ${d.debtStrategy==='snowball'?'active':''}" onclick="PF.wizSetDebtStrat('snowball')">Snowball (Lowest Balance)</button>
          </div>
        </div>
      `;
    } else if (step === 6) {
      bodyHtml = `
        <div class="sub-bubble" style="margin-bottom:12px;">
          <strong style="font-size:13px;">Add Unlimited Goals</strong>
          <div class="chip-group">
            <button class="chip-btn" onclick="PF.wizAddGoal('emergency')">+ Emergency Fund</button>
            <button class="chip-btn" onclick="PF.wizAddGoal('home')">+ Home Purchase</button>
            <button class="chip-btn" onclick="PF.wizAddGoal('land')">+ Land / Homestead</button>
            <button class="chip-btn" onclick="PF.wizAddGoal('purchase')">+ Major Purchase</button>
            <button class="chip-btn" onclick="PF.wizAddGoal('investment')">+ Investment</button>
          </div>
          <div class="field" style="margin-top:4px;">
            <label>Allocation Mode</label>
            <div class="chip-group">
              <button class="chip-btn ${d.allocationMode==='waterfall'?'active':''}" onclick="PF.wizSetAlloc('waterfall')">Sequential Domino Waterfall</button>
              <button class="chip-btn ${d.allocationMode==='parallel'?'active':''}" onclick="PF.wizSetAlloc('parallel')">Parallel Split (%)</button>
            </div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${d.goals.map((g, idx) => renderGoalEditorCard(g, idx, d, true)).join('')}
        </div>
      `;
    }

    return `
      <div class="wizard-shell">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div>
            <span class="pill pill-cyan" style="margin-bottom:4px;">Step ${step} of 6</span>
            <h2 style="font-size:20px;margin-top:4px;">${stepTitles[step - 1]}</h2>
          </div>
          <button class="btn btn-sm" onclick="PF.cancelWizard()">Cancel</button>
        </div>

        <div class="wizard-progress">
          ${[1,2,3,4,5,6].map(n => `<div class="w-bar ${n < step ? 'done' : n === step ? 'current' : ''}"></div>`).join('')}
        </div>

        <div class="glass-card" style="flex:1;">
          ${bodyHtml}
        </div>

        <div style="display:flex;justify-content:space-between;gap:10px;">
          <button class="btn" onclick="PF.wizStep(${step - 1})" ${step === 1 ? 'disabled' : ''}>← Back</button>
          ${step < 6
            ? `<button class="btn btn-cyan" onclick="PF.wizStep(${step + 1})">Continue →</button>`
            : `<button class="btn btn-emerald" onclick="PF.finishWizard()">Launch My Blueprint →</button>`}
        </div>
      </div>
    `;
  }

  function renderGoalEditorCard(g, idx, planObj, isWizard) {
    const prefix = isWizard ? 'PF.wizGoal' : 'PF.planGoal';
    const isCouple = planObj.household.type === 'couple';
    return `
      <div class="sub-bubble ${g.type==='home'?'cyan-rim':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <input class="input" style="font-weight:700;" value="${esc(g.name)}" oninput="${prefix}Edit(${idx},'name',this.value)" />
          <div style="display:flex;gap:5px;flex-shrink:0;">
            ${!isWizard ? `<button class="btn btn-sm" onclick="PF.moveGoal(${idx},-1)" ${idx===0?'disabled':''}>↑</button><button class="btn btn-sm" onclick="PF.moveGoal(${idx},1)" ${idx===planObj.goals.length-1?'disabled':''}>↓</button>` : ''}
            <button class="btn btn-sm btn-danger" onclick="${prefix}Del(${idx})">✕</button>
          </div>
        </div>
        ${g.type === 'home' ? `

  function ringSvg(pct, color, size = 58, stroke = 5) {
    const r = (size - stroke * 2) / 2;
    const c = 2 * Math.PI * r;
    const off = c * (1 - clamp(pct, 0, 100) / 100);
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(148,163,184,0.16)" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      </svg>
    `;
  }

  function drawConstellationCurves() {
    const svg = document.getElementById('constellation-svg');
    const stage = svg?.parentElement;
    if (!svg || !stage || window.innerWidth < 860) { if (svg) svg.innerHTML = ''; return; }

    const sRect = stage.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${sRect.width} ${sRect.height}`);

    const c0 = [...stage.querySelectorAll('[data-col="0"]')];
    const c1 = [...stage.querySelectorAll('[data-col="1"]')];
    const c2 = [...stage.querySelectorAll('[data-col="2"]')];

    let html = '';
    const link = (a, b, col) => {
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.right - sRect.left, y1 = ra.top + ra.height / 2 - sRect.top;
      const x2 = rb.left - sRect.left,  y2 = rb.top + rb.height / 2 - sRect.top;
      const cx = (x1 + x2) / 2;
      html += `<path class="energy-line" stroke="${col}" d="M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${cx.toFixed(1)} ${y1.toFixed(1)}, ${cx.toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
    };
    c0.forEach((a, i) => c1.forEach(b => link(a, b, i === 0 ? '#22D3EE' : '#A78BFA')));
    c1.forEach((a, i) => c2.forEach(b => link(a, b, i === 1 ? '#FBBF24' : '#34D399')));
    svg.innerHTML = html;
  }

  window.addEventListener('resize', () => {
    if (ui.mode === 'app' && ui.activeTab === 'constellation') requestAnimationFrame(drawConstellationCurves);
  });

  function drawTrajectoryChart(plan, liveSim, wiSim, wiActive) {
    const stage = document.getElementById('traj-chart-stage');
    if (!stage) return;

    const baseSeries = (plan.baseline && plan.baseline.series && plan.baseline.series.length > 1)
      ? plan.baseline.series
      : liveSim.series;
    const activeSeries = wiActive ? wiSim.series : liveSim.series;

    const horizon = clamp(Math.max(baseSeries.length - 1, activeSeries.length - 1, 24), 24, 180);
    const getPt = (arr, m) => arr[Math.min(m, arr.length - 1)] || { month: m, cash: 0, debt: 0, netPos: 0 };

    const W = 780, H = 280;
    const padL = 62, padR = 20, padT = 26, padB = 34;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    let maxY = 10000;
    for (let m = 0; m <= horizon; m++) {
      const pb = getPt(baseSeries, m), pa = getPt(activeSeries, m);
      maxY = Math.max(maxY, pb.cash, pb.debt, pa.cash, pa.debt);
    }
    plan.checkIns.forEach(ci => { maxY = Math.max(maxY, ci.cash, ci.totalDebt); });
    maxY *= 1.12;

    const xOf = m => padL + (m / Math.max(1, horizon)) * plotW;
    const yOf = v => padT + plotH - (clamp(v, 0, maxY) / maxY) * plotH;

    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const val = (maxY * i) / 4;
      const y = yOf(val);
      grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>`;
      grid += `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="#94A3B8" font-size="10.5" class="tabular">${fmtCompact(val)}</text>`;
    }

    const baseDate = plan.baseline?.lockedAt ? new Date(plan.baseline.lockedAt) : new Date();
    const ticks = Math.min(5, horizon);
    for (let i = 0; i <= ticks; i++) {
      const m = Math.round((horizon * i) / ticks);
      const lbl = m === 0 ? 'Start' : fmtMonthYear(addMonthsDate(m, baseDate));
      grid += `<text x="${xOf(m).toFixed(1)}" y="${H - 10}" text-anchor="middle" fill="#94A3B8" font-size="10.5">${lbl}</text>`;
    }

    const buildPath = (arr, key) => {
      let d = '';
      for (let m = 0; m <= horizon; m++) d += `${m === 0 ? 'M' : 'L'}${xOf(m).toFixed(1)},${yOf(getPt(arr, m)[key]).toFixed(1)} `;
      return d;
    };

    const baseCashPath = buildPath(baseSeries, 'cash');
    const baseArea = `${baseCashPath} L${xOf(horizon).toFixed(1)},${yOf(0).toFixed(1)} L${xOf(0).toFixed(1)},${yOf(0).toFixed(1)} Z`;
    const activeCashPath = buildPath(activeSeries, 'cash');
    const debtPath = buildPath(activeSeries, 'debt');

    let pins = '';
    const goalSource = wiActive ? wiSim.goals : liveSim.goals;
    goalSource.filter(g => g.achievedExact !== null && g.achievedExact > 0 && g.achievedExact <= horizon).slice(0, 5).forEach((g, idx) => {
      const x = xOf(g.achievedExact);
      const y = yOf(getPt(activeSeries, Math.round(g.achievedExact)).cash);
      const anchor = x > W - 140 ? 'end' : 'start';
      const dx = anchor === 'end' ? -6 : 6;
      const shortNm = g.name.length > 18 ? g.name.slice(0, 17) + '…' : g.name;
      pins += `
        <line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT + plotH}" stroke="#34D399" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#34D399" stroke="#070B14" stroke-width="2"/>
        <text x="${(x + dx).toFixed(1)}" y="${padT + 10 + (idx % 2) * 14}" text-anchor="${anchor}" fill="#6EE7B7" font-size="10" font-weight="700">${esc(shortNm)}</text>
      `;
    });

    let checkInDots = '';
    const lockMs = baseDate.getTime();
    plan.checkIns.forEach(ci => {
      const mOff = clamp((new Date(ci.dateIso).getTime() - lockMs) / (DAYS_PER_MONTH * 86400000), 0, horizon);
      checkInDots += `<circle cx="${xOf(mOff).toFixed(1)}" cy="${yOf(ci.cash).toFixed(1)}" r="5.5" fill="#FBBF24" stroke="#070B14" stroke-width="2"/>`;
    });

    stage.innerHTML = `
      <svg id="sim-svg" class="chart-svg" viewBox="0 0 ${W} ${H}">
        <defs>
          <linearGradient id="cArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.01"/>
          </linearGradient>
        </defs>
        ${grid}
        <path d="${baseArea}" fill="url(#cArea)"/>
        <path d="${debtPath}" fill="none" stroke="#FB7185" stroke-width="2" opacity="0.85"/>
        <path d="${baseCashPath}" fill="none" stroke="#22D3EE" stroke-width="2.4" opacity="${wiActive ? '0.65' : '1'}"/>
        ${wiActive ? `<path d="${activeCashPath}" fill="none" stroke="#34D399" stroke-width="2.8" stroke-dasharray="7 5" stroke-linecap="round"/>` : ''}
        ${pins}
        ${checkInDots}
        <line id="sc-line" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="#F8FAFC" stroke-width="1" stroke-dasharray="3 3" opacity="0.55" style="display:none;"/>
        <circle id="sc-dot-a" r="4.5" fill="${wiActive ? '#34D399' : '#22D3EE'}" stroke="#070B14" stroke-width="2" style="display:none;"/>
        <rect id="sc-hit" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent" style="cursor:crosshair;"/>
      </svg>
      <div id="sim-tip" class="chart-tip tabular"></div>
    `;

    const svg = document.getElementById('sim-svg');
    const hit = document.getElementById('sc-hit');
    const line = document.getElementById('sc-line');
    const dotA = document.getElementById('sc-dot-a');
    const tip = document.getElementById('sim-tip');

    const scrub = (clientX) => {
      const r = svg.getBoundingClientRect();
      const sx = ((clientX - r.left) / r.width) * W;
      const m = clamp(Math.round(((sx - padL) / plotW) * horizon), 0, horizon);
      const pa = getPt(activeSeries, m), pb = getPt(baseSeries, m);
      const x = xOf(m);

      line.setAttribute('x1', x); line.setAttribute('x2', x); line.style.display = 'block';
      dotA.setAttribute('cx', x); dotA.setAttribute('cy', yOf(pa.cash)); dotA.style.display = 'block';

      tip.innerHTML = `
        <div style="font-weight:800;border-bottom:1px solid rgba(148,163,184,0.2);padding-bottom:4px;margin-bottom:5px;">
          ${m === 0 ? 'Start' : `${fmtMonthYear(addMonthsDate(m, baseDate))} (Mo ${m})`}
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:var(--cyan);">Projected Cash:</span><strong>${fmtMoney(pa.cash)}</strong></div>
        ${wiActive ? `<div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:var(--text-2);">Original Baseline:</span><strong>${fmtMoney(pb.cash)}</strong></div>` : ''}
        <div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:var(--rose);">Remaining Debt:</span><strong>${fmtMoney(pa.debt)}</strong></div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:3px;"><span style="color:var(--emerald);">Net Position:</span><strong>${fmtMoney(pa.netPos)}</strong></div>
      `;
      tip.style.display = 'block';
      const relX = clientX - r.left;
      const tipW = tip.offsetWidth || 200;
      tip.style.left = (relX + 14 + tipW > r.width ? Math.max(6, relX - tipW - 14) : relX + 14) + 'px';
      tip.style.top = '10px';
    };

    const endScrub = () => { line.style.display = 'none'; dotA.style.display = 'none'; tip.style.display = 'none'; };

    hit.addEventListener('mousemove', e => scrub(e.clientX));
    hit.addEventListener('mouseleave', endScrub);
    hit.addEventListener('touchstart', e => { if (e.touches[0]) scrub(e.touches[0].clientX); }, { passive: true });
    hit.addEventListener('touchmove', e => { if (e.touches[0]) scrub(e.touches[0].clientX); }, { passive: true });
    hit.addEventListener('touchend', endScrub);
  }

  /* ==========================================================================
     12. TAB 4 — SHARE & PLAN (SMS SUMMARY, BACKUP & MONOCHROME PRINT)
     ========================================================================== */
  function buildPlainTextSnapshot(plan, sim) {
    const pace = computePaceVsBaseline(plan, sim);
    const isCouple = plan.household.type === 'couple';
    const bSum = sim.billSummary;
    const lines = [
      `PATHFINDER OS — ${plan.household.label.toUpperCase()}`,
      `Household: ${isCouple ? `${plan.partnerA.name} & ${plan.partnerB.name} (Couple)` : `${plan.partnerA.name} (Single)`} | Pace: ${pace.label}`,
      `----------------------------------------`,
      `Monthly Net Income: ${fmtMoney(sim.totalNet)}/mo`,
      `Recurring Bills: ${fmtMoney(bSum.total)}/mo (1st-15th: ${fmtMoney(bSum.firstTotal)} | 16th-End: ${fmtMoney(bSum.secondTotal)})`,
      `Variable Living: ${fmtMoney(sim.variableLiving)}/mo | Leakage: ${fmtMoney(sim.leakage)}/mo`,
      `True Monthly Surplus: ${fmtMoney(sim.monthlySurplus)}/mo`,
      `Cash Saved: ${fmtMoney(plan.cash.liquid)} (${sim.hysaApy.toFixed(2)}% APY)`,
      `Total Debt: ${fmtMoney(sim.initDebtTotal)} | Debt-Free: ${sim.initDebtTotal <= 0 ? 'Debt-Free!' : (sim.debtFreeDate ? fmtMonthYear(sim.debtFreeDate) : 'Needs Surplus')}`,
      ``,
      `EXACT GOAL DATES:`
    ];
    sim.goals.forEach((g, i) => {
      const dt = g.achievedDate ? (g.achievedExact <= 0.05 ? 'Ready Now' : fmtMonthYear(g.achievedDate)) : g.status;
      const extra = g.isHome && g.uw ? ` (${g.uw.prog.name}, ${fmtMoney(g.uw.totalPITI)}/mo PITI)` : '';
      lines.push(`${i + 1}. ${g.name} — ${dt} [${fmtMoney(g.targetCash)} cash]${extra}`);
    });
    if (plan.checkIns.length) {
      lines.push('', `Check-In Streak: ${plan.checkIns.length} logged (${CADENCE_LABELS[plan.household.cadence]})`);
    }
    return lines.join('\n');
  }

    if (type !== 'bills') { ui.testKilledBillIds = []; ui.editingBillId = null; }
    renderSheetBody();
    document.getElementById('sheet-backdrop').classList.add('open');
    document.getElementById('sheet-panel').classList.add('open');
  }

  function closeSheet() {
    ui.sheetType = null;
    ui.testKilledBillIds = [];
    ui.editingBillId = null;
    document.getElementById('sheet-backdrop').classList.remove('open');
    document.getElementById('sheet-panel').classList.remove('open');
  }

      titleEl.textContent = `Recurring Bills & Due Dates`;
      subEl.textContent = `${ymLabel} · Paid checkoffs auto-reset next month.`;

      // Compute combined Test Kill impact if any cuttable bills are toggled
      let killSummaryHtml = '';
      if (ui.testKilledBillIds.length) {
        const simKill = runSimulation(plan, { killedBillIds: ui.testKilledBillIds }, new Date());
        const savedMoAmt = plan.bills.filter(b => ui.testKilledBillIds.includes(b.id)).reduce((s, b) => s + num(b.amount), 0);
        const pgBase = cachedLive.primaryGoal, pgKill = simKill.primaryGoal;
        let impactMsg = `Frees ${fmtMoney(savedMoAmt)}/mo (${fmtMoney(savedMoAmt * 12)}/yr).`;
        if (pgBase && pgKill) {
          if (pgBase.achievedExact === null && pgKill.achievedExact !== null) {
            impactMsg = `Unlocks "${pgKill.name}" on ${fmtMonthYear(pgKill.achievedDate)}!`;
          } else if (pgBase.achievedExact !== null && pgKill.achievedExact !== null) {

    } else if (ui.sheetType === 'credit') {

  function openModal(title, bodyHtml, footHtml, narrow = true) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-foot').innerHTML = footHtml;
    document.getElementById('modal-box').classList.toggle('narrow', narrow);
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  // Global helper for inline due-day clamping
  window.clampDay = (v) => clamp(Math.round(num(v, 1)), 1, 31);

  function refreshWizardSurplus() {
    const d = ui.wizardDraft;
    if (!d) return;
    const isC = d.household.type === 'couple';
    const net = calcPartnerIncome(d.partnerA, d.household.effTaxPct).netMonthly + (isC ? calcPartnerIncome(d.partnerB, d.household.effTaxPct).netMonthly : 0);
    const bSum = summarizeBills(d);
    const ex = d.expenses;
    const varLiv = num(ex.groceries) + num(ex.transport) + num(ex.misc);
    const dMins = (d.debts || []).reduce((s, x) => s + num(x.minPayment), 0);
    const surp = net - bSum.total - varLiv - num(ex.leakage) - dMins;
    const el = document.getElementById('wiz-surplus-val');
    const sub = document.getElementById('wiz-surplus-sub');
    if (el) { el.textContent = `${fmtMoney(surp)}/mo`; el.style.color = surp >= 0 ? 'var(--emerald)' : 'var(--rose)'; }
    if (sub) { sub.textContent = `Net ${fmtMoney(net)} − Bills ${fmtMoney(bSum.total)} − Living ${fmtMoney(varLiv)} − Leakage ${fmtMoney(ex.leakage)}`; }
  }

    wizSetType(t) {
      ui.wizardDraft.household.type = t;

    wizIncMode(pKey, m) { ui.wizardDraft[pKey].incomeMode = m; render(); },
    wizIncVal(pKey, k, v) { ui.wizardDraft[pKey][k] = parseFloat(v) || 0; render(); },
    wizCredit(pKey, k, v) { ui.wizardDraft[pKey][k] = v; render(); },
    wizAddBill() {
      ui.wizardDraft.bills.push({ id: uid('b'), name: 'New Bill', amount: 60, dueDay: 15, autopay: true, cuttable: false, isHousing: false });
      render();
    },
    wizDelBill(idx) { ui.wizardDraft.bills.splice(idx, 1); render(); },
    wizBillEdit(idx, k, v) { ui.wizardDraft.bills[idx][k] = v; refreshWizardSurplus(); },
    wizBillToggle(idx, k) {
      const b = ui.wizardDraft.bills[idx];
      if (k === 'isHousing') b.isHousing = !isBillHousing(b);
      else b[k] = !b[k];
      render();
    },
    wizExp(k, v) { ui.wizardDraft.expenses[k] = parseFloat(v) || 0; refreshWizardSurplus(); },
    wizAddDebt() { ui.wizardDraft.debts.push({ id: uid('d'), name: 'Credit Card / Loan', balance: 2500, apr: 18.9, minPayment: 75, owner: 'partnerA' }); render(); },
    wizDelDebt(i) { ui.wizardDraft.debts.splice(i, 1); render(); },
    wizSetDebtStrat(s) { ui.wizardDraft.debtStrategy = s; render(); },
    wizSetAlloc(m) { ui.wizardDraft.allocationMode = m; render(); },
    wizAddGoal(t) { addGoalToObj(ui.wizardDraft, t); render(); },
    wizGoalEdit(i, k, v, rerender = false) { ui.wizardDraft.goals[i][k] = v; if (rerender) render(); },
    wizGoalDel(i) { ui.wizardDraft.goals.splice(i, 1); render(); },

    finishWizard() {
      const d = clone(ui.wizardDraft);
      d.isSample = false;
      if (!d.household.label.trim()) d.household.label = d.household.type === 'couple' ? `${d.partnerA.name} & ${d.partnerB.name}` : `${d.partnerA.name}'s Blueprint`;
      if (!d.goals.length) addGoalToObj(d, 'emergency');

      ui.plan = d;
      ui.whatIf = { trimLeakage: 0, incomeBoost: 0, lumpSum: 0, hysaApy: null };

      ui.mode = 'app';
      ui.activeTab = 'constellation';
      savePlan();
      render();

      render();
      if (ui.sheetType === 'bills') renderSheetBody();

      const i = ui.testKilledBillIds.indexOf(billId);
      if (i >= 0) ui.testKilledBillIds.splice(i, 1);

      const b = ui.plan.bills.find(x => x.id === billId);

      else b[k] = !b[k];
      savePlan();
      render();
      renderSheetBody();

      const idx = ui.plan.bills.findIndex(x => x.id === billId);
      if (idx >= 0) {
        const removed = ui.plan.bills.splice(idx, 1)[0];

        render();

        toast(`Canceled "${removed.name}" — freed ${fmtMoney(removed.amount)}/mo!`, 'emerald');

    editHousehold(k, v, rebuildSheet = false) { ui.plan.household[k] = v; savePlan(); render(); if (rebuildSheet) renderSheetBody(); },

    applyLoanProgram(goalIdx, progKey, bMode) {

      if (ui.plan.household.type === 'couple') ui.plan.goals[goalIdx].borrowerMode = bMode;
      savePlan(); render();
      toast(`Switched home goal to ${LOAN_PROGRAMS[progKey].name}`, 'emerald');

    // Payday Check-In Submission
    submitCheckIn() {
      const plan = ui.plan;
      const prevSim = runSimulation(plan, null, new Date());
      const prevGoalMs = prevSim.primaryGoal?.achievedDate?.getTime() || null;

      const newCash = Math.max(0, num(document.getElementById('ci-cash')?.value, plan.cash.liquid));
      const debtBalances = {};
      document.querySelectorAll('[data-ci-debt]').forEach(inp => {
        const id = inp.dataset.ciDebt;
        const val = Math.max(0, num(inp.value, 0));
        debtBalances[id] = val;
        const dObj = plan.debts.find(d => d.id === id);
        if (dObj) dObj.balance = val;
      });

      const fAEl = document.getElementById('ci-fico-a');
      const fBEl = document.getElementById('ci-fico-b');
      if (fAEl) plan.partnerA.fico = clamp(parseInt(fAEl.value) || plan.partnerA.fico, 300, 850);
      if (fBEl && plan.household.type === 'couple') plan.partnerB.fico = clamp(parseInt(fBEl.value) || plan.partnerB.fico, 300, 850);

      const note = (document.getElementById('ci-note')?.value || '').trim();
      plan.cash.liquid = newCash;
      plan.household.nextPayday = advancePaydayDate(plan.household.nextPayday, plan.household.cadence);

      const newSim = runSimulation(plan, null, new Date());
      const newGoalMs = newSim.primaryGoal?.achievedDate?.getTime() || null;
      const deltaPrevDays = (prevGoalMs && newGoalMs) ? Math.round((prevGoalMs - newGoalMs) / 86400000) : 0;
      const pace = computePaceVsBaseline(plan, newSim);

      plan.checkIns.unshift({
        id: uid('ci'),
        dateIso: new Date().toISOString(),
        cash: newCash,
        totalDebt: newSim.initDebtTotal,
        debtBalances,
        ficoA: plan.partnerA.fico,
        ficoB: plan.partnerB.fico,
        note,
        daysDeltaFromPrev: deltaPrevDays,
        daysDeltaFromBaseline: pace.daysAhead
      });

      const gName = newSim.primaryGoal ? newSim.primaryGoal.name : 'your primary goal';
      if (deltaPrevDays > 0 || pace.daysAhead > 2) {
        ui.lastCheckInFeedback = {
          tone: 'emerald',
          headline: deltaPrevDays > 0
            ? `🔥 You pulled "${gName}" forward by ${deltaPrevDays} day${deltaPrevDays === 1 ? '' : 's'}!`
            : `🔥 You are ${pace.daysAhead} days ahead of schedule!`,
          detail: `Overall pace vs. baseline: <strong>${esc(pace.label)}</strong>. Next check-in: ${fmtShortDate(plan.household.nextPayday)}.`
        };
      } else if (deltaPrevDays < 0 || pace.daysAhead < -2) {
        const behind = Math.abs(pace.daysAhead < 0 ? pace.daysAhead : deltaPrevDays);
        const catchUpMo = Math.max(25, Math.ceil((behind / 30) * Math.max(100, newSim.monthlySurplus * 0.25) / 25) * 25);
        ui.lastCheckInFeedback = {
          tone: 'amber',
          headline: `${behind} days behind schedule — easy to win back.`,
          detail: `Trimming roughly <strong>${fmtMoney(catchUpMo)}/mo</strong> in leakage or canceling a cuttable subscription puts you right back on track.`
        };
      } else {
        ui.lastCheckInFeedback = {
          tone: 'emerald',
          headline: `Check-In Logged — Right on Schedule!`,
          detail: `Cash: <strong>${fmtMoney(newCash)}</strong> · Total Debt: <strong>${fmtMoney(newSim.initDebtTotal)}</strong> · Streak: ${plan.checkIns.length}.`
        };
      }

      savePlan();
      render();
      toast('Payday Check-In saved!', 'emerald');
    },

    deleteCheckIn(idx) {
      ui.plan.checkIns.splice(idx, 1);
      savePlan();
      render();
      toast('Check-in removed.', 'amber');
    },

    // What-If Sliders
    setWhatIf(k, v) { ui.whatIf[k] = parseFloat(v); render(); },
    resetWhatIf() { ui.whatIf = { trimLeakage: 0, incomeBoost: 0, lumpSum: 0, hysaApy: null }; render(); },
    applyWhatIf() {
      const p = ui.plan, w = ui.whatIf;
      if (w.trimLeakage > 0) p.expenses.leakage = Math.max(0, num(p.expenses.leakage) - w.trimLeakage);
      if (w.incomeBoost > 0) {
        if (p.partnerA.incomeMode === 'net') p.partnerA.monthlyNet = num(p.partnerA.monthlyNet) + w.incomeBoost;
        else {
          const curNet = calcPartnerIncome(p.partnerA, p.household.effTaxPct).netMonthly;
          p.partnerA.incomeMode = 'net';
          p.partnerA.monthlyNet = Math.round(curNet + w.incomeBoost);
        }
      }
      if (w.lumpSum > 0) p.cash.liquid = num(p.cash.liquid) + w.lumpSum;
      if (w.hysaApy !== null) p.cash.hysaApy = w.hysaApy;
      ui.whatIf = { trimLeakage: 0, incomeBoost: 0, lumpSum: 0, hysaApy: null };
      savePlan();
      render();
      toast('What-If adjustments applied to your real plan!', 'emerald');
    },

    // Share, Backup, Print & Safety
    copySnapshot() {
      const txt = buildPlainTextSnapshot(ui.plan, cachedLive);
      if (copyToClipboard(txt)) toast('Plain-text plan copied! Ready to paste in SMS.', 'emerald');
      else toast('Select & copy from the preview box above.', 'amber');
    },

    printBlueprint() {
      renderPrintBlueprint(ui.plan, cachedLive);
      window.print();
    },

    exportBackup() {
      const blob = new Blob([JSON.stringify({ app: 'pathfinder_os_mobile', version: 2, plan: ui.plan }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pathfinder_os_backup_${todayIso()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('JSON Backup downloaded!', 'emerald');
    },

    triggerImport() { document.getElementById('import-json-input').click(); },

    handleImportFile(ev) {
      const file = ev.target.files?.[0];
      ev.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const imported = migratePlan(data.plan || (data.household && data.partnerA ? data : null));
          if (!imported) { toast('Invalid Pathfinder OS JSON file.', 'rose'); return; }
          if (!imported.baseline) lockBaselineOnPlan(imported);
          ui.plan = imported;
          ui.mode = 'app';
          ui.activeTab = 'constellation';
          savePlan();
          render();
          toast('Backup plan restored!', 'emerald');
        } catch (e) {
          toast('Could not parse JSON file.', 'rose');
        }
      };
      reader.readAsText(file);
    },

    promptRelockBaseline() {
      openModal(
        'Re-Lock Baseline Snapshot?',
        `<p style="color:var(--text-2);font-size:13.5px;">Sets today's projected dates and balances as your new <strong>Original Baseline</strong> for future Payday Check-In pace tracking. Your history remains intact.</p>`,
        `<button class="btn btn-sm" onclick="PF.closeModal()">Cancel</button>
         <button class="btn btn-sm btn-amber" onclick="PF.confirmRelockBaseline()">Re-Lock Baseline</button>`,
        true
      );
    },

    confirmRelockBaseline() {
      lockBaselineOnPlan(ui.plan);
      savePlan(); closeModal(); render();
      toast('New baseline locked as of today!', 'emerald');
    },

    promptResetApp() {
      openModal(
        'Wipe All Data?',
        `<p style="color:var(--text-2);font-size:13.5px;">Clears your saved plan, bills, and check-in history from this device and returns to the welcome screen. Export a JSON backup first if you want a copy.</p>`,
        `<button class="btn btn-sm" onclick="PF.closeModal()">Cancel</button>
         <button class="btn btn-sm btn-danger" onclick="PF.confirmResetApp()">Wipe All Data</button>`,
        true
      );
    },

    confirmResetApp() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      ui.plan = null;
      ui.lastCheckInFeedback = null;
      ui.testKilledBillIds = [];
      ui.whatIf = { trimLeakage: 0, incomeBoost: 0, lumpSum: 0, hysaApy: null };
      ui.mode = 'welcome';
      closeModal();
      render();
      toast('All local data wiped.', 'amber');
    }
  };

  function addGoalToObj(obj, type) {
    const g = { id: uid('g'), type, weight: 25 };
    if (type === 'home') {
      Object.assign(g, { name: 'Buy a Home', price: 340000, loanProgram: 'fha', rate: 6.5, closingPct: 3, propTaxPct: obj.household.propTaxPct, monthlyIns: 115, replaceRent: true, borrowerMode: 'auto' });
    } else if (type === 'land') {
      Object.assign(g, { name: 'Land / Homestead', targetAmount: 45000 });
    } else if (type === 'emergency') {
      Object.assign(g, { name: 'Emergency Reserve', targetAmount: 6000 });
    } else if (type === 'investment') {
      Object.assign(g, { name: 'Investment / Wealth Target', targetAmount: 50000, expectedApy: 7.5 });
    } else {
      Object.assign(g, { name: 'Major Purchase', targetAmount: 15000 });
    }
    obj.goals.push(g);
  }

  // Boot App
  window.addEventListener('DOMContentLoaded', () => {
    loadFromStorage();
    render();
  });

  return api;
})();
</script>
</body>
</html>
