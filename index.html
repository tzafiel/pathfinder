<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pathfinder OS" />
  <meta name="theme-color" content="#070B14" />
  <title>Pathfinder OS — Reverse-Engineered Goal Solver</title>

  <!-- Inline SVG App Icon & Favicon (Zero External Assets) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3CradialGradient id='g' cx='32%25' cy='28%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%2322D3EE'/%3E%3Cstop offset='52%25' stop-color='%230F2942'/%3E%3Cstop offset='100%25' stop-color='%23070B14'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='28' fill='%23070B14'/%3E%3Ccircle cx='64' cy='64' r='48' fill='url(%23g)' stroke='%2322D3EE' stroke-width='3'/%3E%3Ccircle cx='64' cy='64' r='34' fill='none' stroke='%2334D399' stroke-width='2' stroke-dasharray='8 6' opacity='0.8'/%3E%3Cpath d='M64 26 L75 64 L64 102 L53 64 Z' fill='%2322D3EE'/%3E%3Cpath d='M64 26 L75 64 L64 64 Z' fill='%23E0F2FE'/%3E%3Ccircle cx='64' cy='64' r='6' fill='%23070B14' stroke='%2334D399' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3CradialGradient id='g' cx='32%25' cy='28%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%2322D3EE'/%3E%3Cstop offset='50%25' stop-color='%23112640'/%3E%3Cstop offset='100%25' stop-color='%23070B14'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='180' height='180' fill='%23070B14'/%3E%3Ccircle cx='90' cy='90' r='66' fill='url(%23g)' stroke='%2322D3EE' stroke-width='4'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='%2334D399' stroke-width='2.5' stroke-dasharray='10 7' opacity='0.85'/%3E%3Cpath d='M90 36 L106 90 L90 144 L74 90 Z' fill='%2322D3EE'/%3E%3Cpath d='M90 36 L106 90 L90 90 Z' fill='%23F0FDFA'/%3E%3Ccircle cx='90' cy='90' r='8' fill='%23070B14' stroke='%2334D399' stroke-width='3'/%3E%3C/svg%3E" />

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & DEEP-SPACE GLASSMORPHIC SYSTEM
       ========================================================================= */
    :root {
      --bg-void: #070B14;
      --bg-deep: #0B1222;
      --bg-nebula: #0E1628;

      --glass-bg: rgba(14, 22, 40, 0.62);
      --glass-strong: rgba(11, 18, 34, 0.88);
      --glass-hover: rgba(22, 34, 60, 0.78);
      --glass-border: rgba(148, 163, 184, 0.18);
      --glass-border-hi: rgba(226, 232, 240, 0.30);

      --cyan: #22D3EE;
      --cyan-soft: rgba(34, 211, 238, 0.14);
      --emerald: #34D399;
      --emerald-soft: rgba(52, 211, 153, 0.14);
      --violet: #A78BFA;
      --violet-soft: rgba(167, 139, 250, 0.16);
      --amber: #FBBF24;
      --amber-soft: rgba(251, 191, 36, 0.15);
      --rose: #FB7185;
      --rose-soft: rgba(251, 113, 133, 0.15);

      --text-1: #F1F5F9;
      --text-2: #94A3B8;
      --text-3: #64748B;

      --r-orb: 26px;
      --r-card: 22px;
      --r-input: 14px;
      --r-pill: 999px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font-sys: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: var(--font-sys);
      font-size: 14.5px;
      line-height: 1.48;
      color: var(--text-1);
      background-color: var(--bg-void);
      background-image:
        radial-gradient(ellipse 72% 52% at 14% 8%, rgba(34, 211, 238, 0.12), transparent 60%),
        radial-gradient(ellipse 60% 48% at 88% 14%, rgba(167, 139, 250, 0.12), transparent 60%),
        radial-gradient(ellipse 65% 48% at 50% 94%, rgba(52, 211, 153, 0.09), transparent 62%),
        linear-gradient(180deg, #070B14 0%, #0B1222 52%, #0E1628 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1); }
    p { margin: 0; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; }

    /* =========================================================================
       2. APP SHELL, TOP BAR & ADAPTIVE BOTTOM/TOP NAVIGATION
       ========================================================================= */
    .app-root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 35;
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: rgba(7, 11, 20, 0.80);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
    }

    .top-header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-emblem {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: radial-gradient(circle at 32% 28%, #67E8F9, #0891B2 54%, #1E1B4B 100%);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.42), inset 0 1px 2px rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(90deg, #F8FAFC, #67E8F9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Desktop Top Pill Nav (Hidden on mobile) */
    .desktop-nav {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border-radius: var(--r-pill);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--glass-border);
    }

    .desktop-nav .nav-item {
      min-height: 38px;
      padding: 7px 14px;
      border-radius: var(--r-pill);
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .desktop-nav .nav-item:hover { color: var(--text-1); }
    .desktop-nav .nav-item.active {
      background: var(--cyan-soft);
      color: #67E8F9;
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.36);
    }

    /* Sticky Mobile Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding: 8px 10px calc(8px + var(--safe-bottom));
      background: rgba(7, 11, 20, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .bottom-nav .nav-item {
      min-height: 48px;
      border: none;
      border-radius: 16px;
      background: transparent;
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 600;
      position: relative;
      transition: all 0.18s ease;
    }

    .bottom-nav .nav-item.active {
      color: var(--cyan);
      background: rgba(34, 211, 238, 0.10);
    }

    .nav-dot {
      position: absolute;
      top: 6px;
      right: calc(50% - 16px);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
    }

    .main-container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 14px calc(92px + var(--safe-bottom));
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 860px) {
      .desktop-nav { display: flex; }
      .bottom-nav { display: none; }
      .main-container { padding: 22px 24px 48px; gap: 20px; }
    }

    /* Sample Preview Banner */
    .sample-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-radius: 20px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.38);
      font-size: 12.5px;
      color: #FDE68A;
    }

    /* =========================================================================
       3. BUTTONS, PILLS, GLASS CARDS & FORM INPUTS
       ========================================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: var(--r-pill);
      border: 1px solid var(--glass-border-hi);
      background: rgba(30, 41, 59, 0.62);
      color: var(--text-1);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn:hover { background: rgba(51, 65, 85, 0.82); border-color: rgba(248, 250, 252, 0.42); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-cyan {
      background: linear-gradient(135deg, #06B6D4, #22D3EE);
      border-color: rgba(165, 243, 252, 0.72);
      color: #031521;
      font-weight: 700;
      box-shadow: 0 0 22px rgba(34, 211, 238, 0.32);
    }

    .btn-cyan:hover { background: linear-gradient(135deg, #22D3EE, #67E8F9); color: #02101A; }

    .btn-emerald {
      background: linear-gradient(135deg, #059669, #34D399);
      border-color: rgba(167, 243, 208, 0.72);
      color: #022015;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.30);
    }

    .btn-emerald:hover { background: linear-gradient(135deg, #10B981, #6EE7B7); color: #022015; }

    .btn-amber {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.52);
      color: #FDE68A;
    }

    .btn-danger {
      background: rgba(190, 18, 60, 0.20);
      border-color: rgba(251, 113, 133, 0.42);
      color: #FDA4AF;
    }

    .btn-sm { min-height: 38px; padding: 7px 13px; font-size: 12px; }
    .btn-full { width: 100%; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill-cyan    { background: var(--cyan-soft);    color: #67E8F9; border: 1px solid rgba(34,211,238,0.34); }
    .pill-emerald { background: var(--emerald-soft); color: #6EE7B7; border: 1px solid rgba(52,211,153,0.36); }
    .pill-violet  { background: var(--violet-soft);  color: #C4B5FD; border: 1px solid rgba(167,139,250,0.38); }
    .pill-amber   { background: var(--amber-soft);   color: #FDE68A; border: 1px solid rgba(251,191,36,0.38); }
    .pill-rose    { background: var(--rose-soft);    color: #FDA4AF; border: 1px solid rgba(251,113,133,0.40); }
    .pill-slate   { background: rgba(148,163,184,0.12); color: var(--text-2); border: 1px solid var(--glass-border); }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-orb);
      padding: 18px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .glass-card { padding: 22px; }
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .card-title { font-size: 16px; font-weight: 700; }
    .card-sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 640px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .grid-2-keep { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }
    @media (min-width: 641px) {
      .grid-2-keep { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    }

    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field label { font-size: 12px; font-weight: 600; color: var(--text-2); }

    .input, .select, .textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      border-radius: var(--r-input);
      border: 1px solid var(--glass-border-hi);
      background: rgba(6, 10, 20, 0.76);
      color: var(--text-1);
      font-size: 14px;
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }

    .select option { background: #0B1222; color: #F1F5F9; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-soft);
    }

    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip-btn {
      min-height: 44px;
      padding: 9px 14px;
      border-radius: var(--r-pill);
      border: 1px solid var(--glass-border-hi);
      background: rgba(15, 23, 42, 0.65);
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.16s ease;
    }

    .chip-btn.active {
      background: var(--cyan-soft);
      border-color: var(--cyan);
      color: #67E8F9;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.22);
    }

    .sub-bubble {
      padding: 14px 16px;
      border-radius: 20px;
      background: rgba(8, 14, 28, 0.66);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .sub-bubble.cyan-rim   { border-color: rgba(34, 211, 238, 0.34); }
    .sub-bubble.violet-rim { border-color: rgba(167, 139, 250, 0.36); }
    .sub-bubble.amber-rim  { border-color: rgba(251, 191, 36, 0.42); background: rgba(251, 191, 36, 0.06); }
    .sub-bubble.rose-rim   { border-color: rgba(251, 113, 133, 0.38); background: rgba(251, 113, 133, 0.05); }
    .sub-bubble.emerald-rim{ border-color: rgba(52, 211, 153, 0.40); background: rgba(52, 211, 153, 0.06); }

    /* Custom Sliders */
    input[type="range"].orb-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.22);
      outline: none;
      margin: 8px 0;
    }

    input[type="range"].orb-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--cyan);
      border: 2.5px solid #070B14;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.72);
      cursor: pointer;
    }
    input[type="range"].orb-slider.violet::-webkit-slider-thumb  { background: var(--violet);  box-shadow: 0 0 14px rgba(167, 139, 250, 0.72); }
    input[type="range"].orb-slider.amber::-webkit-slider-thumb   { background: var(--amber);   box-shadow: 0 0 14px rgba(251, 191, 36, 0.72); }
    input[type="range"].orb-slider.emerald::-webkit-slider-thumb { background: var(--emerald); box-shadow: 0 0 14px rgba(52, 211, 153, 0.72); }

    /* =========================================================================
       4. FIRST-LAUNCH WELCOME SCREEN & 6-STEP BRANCHING WIZARD
       ========================================================================= */
    .welcome-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));
    }

    .welcome-card {
      width: min(560px, 100%);
      text-align: center;
      padding: 32px 24px;
      border-radius: 34px;
      background: rgba(12, 20, 38, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(34, 211, 238, 0.26);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 60px rgba(34, 211, 238, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .welcome-orb {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #67E8F9, #0891B2 48%, #1E1B4B 100%);
      box-shadow: 0 0 36px rgba(34, 211, 238, 0.45), inset 0 2px 6px rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wizard-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 780px;
      margin: 0 auto;
      padding: calc(14px + var(--safe-top)) 14px calc(24px + var(--safe-bottom));
      gap: 14px;
    }

    .wizard-progress {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .w-bar {
      height: 6px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.2);
      transition: all 0.22s ease;
    }
    .w-bar.done { background: var(--emerald); }
    .w-bar.current { background: var(--cyan); box-shadow: 0 0 10px rgba(34, 211, 238, 0.65); }

    .choice-orb-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice-orb {
      padding: 18px 16px;
      border-radius: 24px;
      border: 1.5px solid var(--glass-border-hi);
      background: rgba(11, 18, 34, 0.68);
      text-align: left;
      transition: all 0.2s ease;
    }
    .choice-orb.selected {
      border-color: var(--cyan);
      background: linear-gradient(145deg, rgba(34,211,238,0.16), rgba(167,139,250,0.10));
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.20);
    }

    .credit-orb-box {
      padding: 18px;
      border-radius: 24px;
      background: rgba(8, 14, 28, 0.72);
      border: 1px solid var(--glass-border-hi);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .gauge-wrap {
      width: 112px;
      height: 112px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gauge-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }

    /* =========================================================================
       5. HERO BANNER & SPATIAL BUBBLE CONSTELLATION
       ========================================================================= */
    .hero-orb {
      border-radius: 30px;
      padding: 20px 20px 18px;
      background:
        radial-gradient(circle at 88% 12%, rgba(52, 211, 153, 0.16), transparent 46%),
        radial-gradient(circle at 12% 90%, rgba(34, 211, 238, 0.14), transparent 50%),
        rgba(12, 20, 38, 0.80);
      border: 1px solid rgba(34, 211, 238, 0.30);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .hero-date {
      font-size: clamp(32px, 7vw, 44px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.06;
      background: linear-gradient(95deg, #FFFFFF 0%, #67E8F9 60%, #6EE7B7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }

    .hero-kpi-box {
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(7, 11, 20, 0.52);
      border: 1px solid rgba(148, 163, 184, 0.14);

    /* Constellation Stage */

    .orb-btn.emerald { border-color: rgba(52,211,153,0.36); box-shadow: 0 6px 24px rgba(52,211,153,0.11); }
    .orb-btn.amber   { border-color: rgba(251,191,36,0.36); box-shadow: 0 6px 24px rgba(251,191,36,0.10); }
    .orb-btn.rose    { border-color: rgba(251,113,133,0.40); box-shadow: 0 6px 24px rgba(251,113,133,0.12); }

    .orb-row { display: flex; align-items: center; gap: 13px; }
    .ring-sm { width: 58px; height: 58px; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .ring-sm svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .ring-sm-txt { position: relative; z-index: 2; font-weight: 800; font-size: 13px; text-align: center; line-height: 1.05; }

    /* =========================================================================
       6. TABLES, SVG CHART & SLIDE-OVER SHEET / MODAL

    .table-wrap {

      .sheet-panel {
        left: auto;
        top: 14px;
        right: 14px;
        bottom: 14px;

      padding: 16px 20px;

    .modal-overlay {
      position: fixed;
      inset: 0;

      max-height: 88vh;

    .toast {
      padding: 11px 16px;
      border-radius: var(--r-pill);
      background: rgba(8, 14, 28, 0.96);
      border: 1px solid var(--cyan);

    .toast.emerald { border-color: var(--emerald); }
    .toast.amber   { border-color: var(--amber); }
    .toast.rose    { border-color: var(--rose); }

    /* Plain-Text Snapshot Preview Box */
    .snapshot-pre {
      margin: 0;
      padding: 14px;
      border-radius: 16px;
      background: rgba(6, 10, 20, 0.78);
      border: 1px solid var(--glass-border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      color: #CBD5E1;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
    }

    /* Recurring Bills & Due Dates UI */
    .bill-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.74);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-1);
    }

    .bill-row {
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(8, 14, 28, 0.72);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: border-color 0.18s ease, opacity 0.18s ease, background 0.18s ease;
    }

    .bill-row.is-paid {
      border-color: rgba(52, 211, 153, 0.34);
      background: rgba(52, 211, 153, 0.06);
    }

    .bill-row.is-killed {
      border-color: rgba(251, 191, 36, 0.55);
      background: rgba(251, 191, 36, 0.08);
    }

    .bill-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .bill-check {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 8px;
      border: 1.5px solid var(--glass-border-hi);
      background: rgba(6, 10, 20, 0.8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #031521;
      font-size: 14px;
      font-weight: 800;
      transition: all 0.15s ease;
      padding: 0;
    }

    .bill-check.checked {
      background: var(--emerald);
      border-color: var(--emerald);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.45);
    }

    .kill-banner {
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.42);
      font-size: 12px;
      color: #FDE68A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* =========================================================================
       7. MONOCHROME 1-PAGE PRINT BLUEPRINT (@media print)
       ========================================================================= */
    #print-blueprint { display: none; }

    @media print {
      @page { size: letter portrait; margin: 0.45in; }
      html, body {
        background: #FFFFFF !important;
        background-image: none !important;
        color: #000000 !important;
        font-size: 10pt !important;
      }
      .app-root, .sheet-backdrop, .sheet-panel, .modal-overlay, .toast-stack { display: none !important; }
      #print-blueprint {
        display: block !important;
        color: #000000 !important;
      }
      #print-blueprint h1 { font-size: 17pt; color: #000 !important; margin-bottom: 2px; }
      #print-blueprint h2 {
        font-size: 10.5pt;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #000 !important;
        border-bottom: 1.5px solid #000;
        padding-bottom: 3px;
        margin: 12px 0 7px;
      }
      #print-blueprint .p-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2.5px solid #000;
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      #print-blueprint .p-kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }
      #print-blueprint .p-box {
        border: 1px solid #222;
        border-radius: 5px;
        padding: 6px 8px;
      }
      #print-blueprint .p-box span { display: block; font-size: 7.5pt; text-transform: uppercase; color: #333; font-weight: 700; }
      #print-blueprint .p-box strong { font-size: 11.5pt; color: #000; }
      #print-blueprint table { width: 100%; border-collapse: collapse; font-size: 9pt; margin-bottom: 8px; }
      #print-blueprint th, #print-blueprint td { border: 1px solid #333; padding: 5px 7px; color: #000 !important; background: #fff !important; }
      #print-blueprint th { background: #EFEFEF !important; font-weight: 700; }
      #print-blueprint .p-sec { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>

<!-- Toast Stack -->

<!-- Monochrome 1-Page Print Blueprint -->

<script>
/* ============================================================================
   PATHFINDER OS — SELF-SERVE MOBILE GOAL SOLVER, RECURRING BILLS & CHECK-IN
   100% Offline · Zero External Dependencies · Exact Underwriting & Day Delta
   ============================================================================ */
const PF = (function () {
  'use strict';

  const STORAGE_KEY = 'pathfinder_os_selfserve_v1';
  const DAYS_PER_MONTH = 30.4375;
  const MAX_MONTHS = 360;
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS_FULL  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // Regional Tax & USDA Presets
  const REGION_PRESETS = {
    no_tax:   { key: 'no_tax',   label: 'No State Tax (0%)',      stateTaxPct: 0,   effTaxPct: 18, propTaxPct: 0.70, usdaEligible: true  },
    low_tax:  { key: 'low_tax',  label: 'Low State Tax (3%)',     stateTaxPct: 3,   effTaxPct: 21, propTaxPct: 0.85, usdaEligible: false },
    mod_tax:  { key: 'mod_tax',  label: 'Moderate Tax (5.5%)',    stateTaxPct: 5.5, effTaxPct: 24, propTaxPct: 1.05, usdaEligible: false },
    high_tax: { key: 'high_tax', label: 'High State Tax (9%)',    stateTaxPct: 9,   effTaxPct: 28, propTaxPct: 1.25, usdaEligible: false },
    custom:   { key: 'custom',   label: 'Custom Rates',           stateTaxPct: 4,   effTaxPct: 22, propTaxPct: 1.00, usdaEligible: false }
  };

  // Exact Loan Program Underwriting Specifications
  const LOAN_PROGRAMS = {
    fha:    { key: 'fha',    name: 'FHA 3.5%',         downPct: 3.5, minFico: 580, maxDti: 45, ufmipPct: 1.75, annualMiPct: 0.55, requiresUsda: false },
    usda:   { key: 'usda',   name: 'USDA 0%',          downPct: 0,   minFico: 640, maxDti: 41, ufmipPct: 1.00, annualMiPct: 0.35, requiresUsda: true  },
    conv5:  { key: 'conv5',  name: 'Conventional 5%',  downPct: 5,   minFico: 620, maxDti: 43, ufmipPct: 0.00, annualMiPct: 0.75, requiresUsda: false },
    conv20: { key: 'conv20', name: 'Conventional 20%', downPct: 20,  minFico: 620, maxDti: 43, ufmipPct: 0.00, annualMiPct: 0.00, requiresUsda: false },
    va:     { key: 'va',     name: 'VA 0%',            downPct: 0,   minFico: 620, maxDti: 41, ufmipPct: 0.00, annualMiPct: 0.00, requiresUsda: false }
  };

  const CADENCE_LABELS = {
    biweekly:    'Biweekly (Every 2 Weeks)',
    weekly:      'Weekly',
    semimonthly: '1st & 15th',
    monthly:     'Monthly'
  };

  // Runtime UI State
  const ui = {
    plan: null,                 // Active household plan or null -> Welcome screen
    mode: 'welcome',            // 'welcome' | 'wizard' | 'app'
    activeTab: 'constellation', // 'constellation' | 'checkin' | 'simulate' | 'share'
    wizardStep: 1,
    wizardDraft: null,
    sheetType: null,            // 'income' | 'credit' | 'expenses' | 'bills' | 'debts' | 'goals'
    testKilledBillIds: [],      // Temporary bill IDs toggled in "Test Kill / Cancel" mode
    editingBillId: null,        // Inline bill editor toggle inside Bills drawer
    simBorrowerView: 'auto',    // Selected borrower strategy view inside Simulate Matrix
    whatIf: { trimLeakage: 0, incomeBoost: 0, lumpSum: 0, hysaApy: null },
    lastCheckInFeedback: null
  };

  let cachedLive = null;
  let cachedWhatIf = null;

  /* ==========================================================================
     1. UTILITIES, SAFE PARSING & CALENDAR HELPERS
     ========================================================================== */
  function uid(p = 'id') {
    return p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  }

  function num(v, fb = 0) {
    const n = parseFloat(v);
    return Number.isFinite(n) ? n : fb;
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtMoney(v, dec = 0) {
    if (!Number.isFinite(v)) return '$0';
    const neg = v < 0 ? '-' : '';
    return neg + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

  function fmtCompact(v) {
    if (!Number.isFinite(v)) return '$0';
    const neg = v < 0 ? '-' : '';
    const a = Math.abs(v);
    if (a >= 1e6) return neg + '$' + (a / 1e6).toFixed(2) + 'M';
    if (a >= 1e3) return neg + '$' + (a / 1e3).toFixed(a >= 100000 ? 0 : 1) + 'k';
    return neg + '$' + Math.round(a);
  }

  function ordinal(day) {
    const d = clamp(Math.round(num(day, 1)), 1, 31);
    const mod100 = d % 100;
    if (mod100 >= 11 && mod100 <= 13) return d + 'th';
    const mod10 = d % 10;
    if (mod10 === 1) return d + 'st';
    if (mod10 === 2) return d + 'nd';
    if (mod10 === 3) return d + 'rd';
    return d + 'th';
  }

  function currentYmKey(dateObj = new Date()) {
    return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
  }

  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function defaultNextPaydayIso() {
    const d = new Date();
    const diff = (5 - d.getDay() + 7) % 7 || 7;
    d.setDate(d.getDate() + diff);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function advancePaydayDate(currentIso, cadence) {
    const base = currentIso ? new Date(currentIso + 'T12:00:00') : new Date();
    const now = new Date();
    const start = base > now ? base : now;
    const d = new Date(start.getTime());
    if (cadence === 'weekly') {
      d.setDate(d.getDate() + 7);
    } else if (cadence === 'biweekly') {
      d.setDate(d.getDate() + 14);
    } else if (cadence === 'semimonthly') {
      if (d.getDate() < 15) d.setDate(15);
      else { d.setMonth(d.getMonth() + 1); d.setDate(1); }
    } else {
      d.setMonth(d.getMonth() + 1);
    }
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function daysUntilIso(isoStr) {
    if (!isoStr) return 0;
    const target = new Date(isoStr + 'T12:00:00');
    const now = new Date();
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
    return Math.round((target - todayMid) / 86400000);
  }

  function addMonthsDate(exactMonths, baseDate = new Date()) {
    const ms = baseDate.getTime() + exactMonths * DAYS_PER_MONTH * 86400000;
    return new Date(ms);
  }

  function fmtMonthYear(dateObj, full = false) {
    if (!dateObj || isNaN(dateObj.getTime())) return 'Not Reached';
    return `${full ? MONTHS_FULL[dateObj.getMonth()] : MONTHS_SHORT[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
  }

  function fmtShortDate(isoStr) {
    if (!isoStr) return '—';
    const d = new Date(isoStr.length === 10 ? isoStr + 'T12:00:00' : isoStr);
    if (isNaN(d.getTime())) return isoStr;
    return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  }

  function fmtDurationMonths(exactMonths) {
    if (exactMonths === null || exactMonths === undefined) return '—';
    if (exactMonths <= 0.05) return 'Ready Now';
    const m = Math.round(exactMonths);
    if (m < 1) {
      const d = Math.max(1, Math.round(exactMonths * DAYS_PER_MONTH));
      return `${d} day${d === 1 ? '' : 's'}`;
    }
    if (m < 12) return `${m} mo${m === 1 ? '' : 's'}`;
    const y = Math.floor(m / 12), r = m % 12;
    return r === 0 ? `${y} yr${y === 1 ? '' : 's'}` : `${y}y ${r}m`;
  }

  function fmtDaysOrMonthsSaved(deltaMonths) {
    if (!Number.isFinite(deltaMonths) || deltaMonths <= 0.02) return '0 days';
    const totalDays = Math.round(deltaMonths * DAYS_PER_MONTH);
    if (totalDays < 30) return `${totalDays} day${totalDays === 1 ? '' : 's'}`;
    const m = Math.floor(deltaMonths);
    const remDays = Math.round((deltaMonths - m) * DAYS_PER_MONTH);
    if (remDays < 3) return `${m} month${m === 1 ? '' : 's'}`;
    return `${m} mo${m === 1 ? '' : 's'} & ${remDays} days`;
  }

  function monthsUntilYm(ymStr, refDate = new Date()) {
    if (!ymStr || !/^\d{4}-\d{2}$/.test(ymStr)) return null;
    const [y, m] = ymStr.split('-').map(Number);
    return (y - refDate.getFullYear()) * 12 + ((m - 1) - refDate.getMonth());
  }

  function ficoMeta(score) {
    if (score >= 740) return { label: 'Prime', color: '#34D399' };
    if (score >= 680) return { label: 'Strong', color: '#22D3EE' };
    if (score >= 640) return { label: 'FHA/USDA Ready', color: '#A78BFA' };
    if (score >= 580) return { label: 'Fair (FHA)', color: '#FBBF24' };
    return { label: 'Rebuilding', color: '#FB7185' };
  }

  function toast(msg, tone = 'cyan') {
    const stack = document.getElementById('toast-stack');
    const el = document.createElement('div');
    el.className = `toast ${tone}`;
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.25s ease';
      setTimeout(() => el.remove(), 260);
    }, 3000);
  }

  function copyToClipboard(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();

    try { ok = document.execCommand('copy'); } catch (e) {}

    return ok;

  /* ==========================================================================
     2. RECURRING BILLS HELPERS (HALF-MONTH SPLIT, PAID PER YYYY-MM, PAY WINDOW)
     ========================================================================== */
  function isBillHousing(b) {
    if (b.isHousing === true) return true;
    return /\b(rent|mortgage|housing|lease|lot fee)\b/i.test(b.name || '');
  }

  function getBillPaid(plan, billId, ymKey = currentYmKey()) {
    return !!(plan.paidBills && plan.paidBills[ymKey] && plan.paidBills[ymKey][billId]);
  }

  function setBillPaid(plan, billId, paid, ymKey = currentYmKey()) {
    if (!plan.paidBills) plan.paidBills = {};
    if (!plan.paidBills[ymKey]) plan.paidBills[ymKey] = {};
    if (paid) plan.paidBills[ymKey][billId] = true;
    else delete plan.paidBills[ymKey][billId];
  }

  function summarizeBills(plan, excludeIds = []) {
    const excluded = new Set(excludeIds || []);
    const bills = (plan.bills || []).filter(b => !excluded.has(b.id));
    const ym = currentYmKey();
    const firstHalf = [];
    const secondHalf = [];
    let firstTotal = 0, secondTotal = 0, housingTotal = 0, unpaidCount = 0, unpaidTotal = 0;

    const sorted = [...bills].sort((a, b) => num(a.dueDay, 1) - num(b.dueDay, 1));
    for (const b of sorted) {
      const amt = Math.max(0, num(b.amount));
      const day = clamp(Math.round(num(b.dueDay, 1)), 1, 31);
      const paid = getBillPaid(plan, b.id, ym);
      if (isBillHousing(b)) housingTotal += amt;
      if (!paid) { unpaidCount++; unpaidTotal += amt; }
      if (day <= 15) { firstHalf.push(b); firstTotal += amt; }
      else { secondHalf.push(b); secondTotal += amt; }
    }

    return {
      all: sorted,
      firstHalf,
      secondHalf,
      firstTotal,
      secondTotal,
      total: firstTotal + secondTotal,
      housingTotal,
      unpaidCount,
      unpaidTotal,
      ym
    };
  }

  /**
   * Returns all bills whose due day falls between today and nextPayday (handling month-end wrap cleanly).
   */
  function getBillsDueBeforeNextPayday(plan) {
    const bills = plan.bills || [];
    if (!bills.length) return [];

    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
    let end;
    if (plan.household.nextPayday) {
      end = new Date(plan.household.nextPayday + 'T12:00:00');
      if (isNaN(end.getTime()) || end <= start) {
        // If payday is today or past, look ahead one standard pay window
        const span = plan.household.cadence === 'weekly' ? 7 : plan.household.cadence === 'monthly' ? 30 : 14;
        end = new Date(start.getTime() + span * 86400000);
      }
    } else {
      end = new Date(start.getTime() + 14 * 86400000);
    }

    // Clamp window to 31 days max so bills aren't duplicated
    const maxEnd = new Date(start.getTime() + 31 * 86400000);
    if (end > maxEnd) end = maxEnd;

    // Collect every calendar date inside [start, end]
    const upcoming = [];
    const seen = new Set();
    for (let d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) {
      const y = d.getFullYear();
      const m = d.getMonth();
      const dayOfMonth = d.getDate();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const ymKey = `${y}-${String(m + 1).padStart(2, '0')}`;

      for (const b of bills) {
        const effDue = Math.min(clamp(Math.round(num(b.dueDay, 1)), 1, 31), daysInMonth);
        if (effDue === dayOfMonth && !seen.has(b.id)) {
          seen.add(b.id);
          const daysAway = Math.round((d - start) / 86400000);
          upcoming.push({
            bill: b,
            ymKey,
            dueDateLabel: `${MONTHS_SHORT[m]} ${dayOfMonth}`,
            daysAway,
            paid: getBillPaid(plan, b.id, ymKey)
          });
        }
      }
    }

    return upcoming;
  }

  /* ==========================================================================
     4. CORE MATH ENGINE: INCOME, UNDERWRITING & 360-MONTH SIMULATION
     ========================================================================== */
  function calcPartnerIncome(partner, effTaxPct, extraBoostNet = 0) {
    const taxKeep = clamp(1 - num(effTaxPct, 20) / 100, 0.4, 1);
    let gross = 0, net = 0;
    if (partner.incomeMode === 'hourly') {
      gross = (Math.max(0, num(partner.hourlyRate)) * Math.max(0, num(partner.hoursPerWeek)) * 52) / 12;
      net = gross * taxKeep;
    } else if (partner.incomeMode === 'annual') {
      gross = Math.max(0, num(partner.annualSalary)) / 12;
      net = gross * taxKeep;
    } else {
      net = Math.max(0, num(partner.monthlyNet));
      gross = net / taxKeep;
    }
    if (extraBoostNet > 0) {
      net += extraBoostNet;
      gross += extraBoostNet / taxKeep;
    }
    return { grossMonthly: gross, netMonthly: net };
  }

  function calcMonthlyPI(principal, ratePct, years = 30) {
    if (principal <= 0) return 0;
    const n = years * 12;
    const r = Math.max(0, ratePct) / 100 / 12;
    if (r === 0) return principal / n;
    const p = Math.pow(1 + r, n);
    return principal * (r * p) / (p - 1);
  }

  function evaluateMortgage(goal, household, borrowerGross, borrowerMonthlyDebts, ficoScore, overrideProgKey = null) {
    const progKey = overrideProgKey || goal.loanProgram || 'fha';
    const prog = LOAN_PROGRAMS[progKey] || LOAN_PROGRAMS.fha;

    const price = Math.max(0, num(goal.price, 325000));
    const rate = Math.max(0, num(goal.rate, 6.5));
    const closingPct = clamp(num(goal.closingPct, 3), 0, 12);
    const propTaxPct = num(goal.propTaxPct, num(household.propTaxPct, 0.70));
    const monthlyIns = Math.max(0, num(goal.monthlyIns, 110));

    const downPayment = price * (prog.downPct / 100);
    const closingCosts = price * (closingPct / 100);
    const cashToClose = downPayment + closingCosts;

    const baseLoan = Math.max(0, price - downPayment);
    const financedLoan = baseLoan * (1 + prog.ufmipPct / 100);
    const monthlyPI = calcMonthlyPI(financedLoan, rate, 30);
    const monthlyTax = (price * (propTaxPct / 100)) / 12;
    const monthlyMI = (baseLoan * (prog.annualMiPct / 100)) / 12;
    const totalPITI = monthlyPI + monthlyTax + monthlyIns + monthlyMI;

    const backEndDti = borrowerGross > 0 ? ((totalPITI + borrowerMonthlyDebts) / borrowerGross) * 100 : 999;

    // Exact analytical inverse for Max Qualifying Home Price under program DTI cap
    let maxQualifyingPrice = 0;
    if (borrowerGross > 0) {
      const maxHousingPiti = borrowerGross * (prog.maxDti / 100) - borrowerMonthlyDebts;
      const roomAfterIns = maxHousingPiti - monthlyIns;
      if (roomAfterIns > 0) {
        const loanRatio = 1 - prog.downPct / 100;
        const finRatio = loanRatio * (1 + prog.ufmipPct / 100);
        const costPerDollar = calcMonthlyPI(finRatio, rate, 30)
          + (propTaxPct / 100) / 12
          + (loanRatio * (prog.annualMiPct / 100)) / 12;
        maxQualifyingPrice = costPerDollar > 0 ? Math.floor(roomAfterIns / costPerDollar) : 0;
      }
    }

    const usdaOk = !prog.requiresUsda || !!household.usdaEligible;
    const ficoOk = ficoScore >= prog.minFico;
    const dtiOk = backEndDti <= prog.maxDti + 0.01;
    const qualified = usdaOk && ficoOk && dtiOk;

    let blocker = '';
    if (!usdaOk) blocker = 'Area not set as USDA Rural eligible';
    else if (!ficoOk) blocker = `Needs ${prog.minFico} FICO (at ${Math.round(ficoScore)})`;
    else if (!dtiOk) {
      const excess = Math.ceil((totalPITI + borrowerMonthlyDebts) - (borrowerGross * (prog.maxDti / 100)));
      blocker = `DTI ${backEndDti.toFixed(1)}% > ${prog.maxDti}% (cut ${fmtMoney(excess)}/mo debt)`;
    }

    return {
      progKey, prog, price, downPayment, closingCosts, cashToClose,
      financedLoan, monthlyPI, monthlyTax, monthlyIns, monthlyMI, totalPITI,
      backEndDti, maxQualifyingPrice, usdaOk, ficoOk, dtiOk, qualified, blocker,
      ficoScore: Math.round(ficoScore)
    };
  }

  /**
   * Month-by-Month Simulation (up to 360 months) with Recurring Bills Roll-Up,
   * Rent-to-PITI Replacement, Credit Fall-Off Boosts, and Exact Fractional-Month Interpolation.
   */
  function runSimulation(plan, whatIf = null, refDate = new Date()) {
    const isCouple = plan.household.type === 'couple';
    const effTax = num(plan.household.effTaxPct, 18);
    const boostNet = whatIf ? Math.max(0, num(whatIf.incomeBoost)) : 0;
    const trimLeak = whatIf ? Math.max(0, num(whatIf.trimLeakage)) : 0;
    const lumpSum = whatIf ? Math.max(0, num(whatIf.lumpSum)) : 0;
    const killedIds = whatIf && Array.isArray(whatIf.killedBillIds) ? whatIf.killedBillIds : [];
    const hysaApy = (whatIf && whatIf.hysaApy !== null && whatIf.hysaApy !== undefined)
      ? Math.max(0, num(whatIf.hysaApy))
      : Math.max(0, num(plan.cash.hysaApy, 4.25));
    const mHysaRate = hysaApy / 100 / 12;

    const incA = calcPartnerIncome(plan.partnerA, effTax, boostNet);
    const incB = isCouple ? calcPartnerIncome(plan.partnerB, effTax, 0) : { grossMonthly: 0, netMonthly: 0 };
    const totalGross = incA.grossMonthly + incB.grossMonthly;
    const totalNet = incA.netMonthly + incB.netMonthly;

    // Roll up Recurring Bills cleanly into fixed monthly baseline (zero double-counting)
    const billSummary = summarizeBills(plan, killedIds);
    const baseHousing = billSummary.housingTotal;
    const nonHousingBills = Math.max(0, billSummary.total - baseHousing);

    const ex = plan.expenses || {};
    const variableLiving = Math.max(0, num(ex.groceries)) + Math.max(0, num(ex.transport)) + Math.max(0, num(ex.misc));
    const rawLeakage = Math.max(0, num(ex.leakage));
    const effectiveLeakage = Math.max(0, rawLeakage - trimLeak);
    const extraTrim = Math.max(0, trimLeak - rawLeakage);
    const effVariableLiving = Math.max(0, variableLiving - extraTrim);

    const debts = (plan.debts || []).map(d => ({
      ...d,
      origBalance: Math.max(0, num(d.balance)),
      balance: Math.max(0, num(d.balance)),
      apr: Math.max(0, num(d.apr)),
      minPayment: Math.max(0, num(d.minPayment)),
      owner: isCouple ? (d.owner || 'partnerA') : 'partnerA',
      paidOffExact: num(d.balance) <= 0.01 ? 0 : null,
      interestPaid: 0
    }));

    const initDebtTotal = debts.reduce((s, d) => s + d.origBalance, 0);
    const initDebtMins = debts.reduce((s, d) => s + (d.balance > 0 ? d.minPayment : 0), 0);
    const coreExpensesTotal = baseHousing + nonHousingBills + effVariableLiving;
    const monthlySurplus = totalNet - (coreExpensesTotal + effectiveLeakage + initDebtMins);

    // Credit tracking (300–850) with optional derogatory fall-off point boost
    let ficoA = clamp(num(plan.partnerA.fico, 660), 300, 850);
    let ficoB = isCouple ? clamp(num(plan.partnerB.fico, 690), 300, 850) : ficoA;
    const mileMonthA = plan.partnerA.hasMilestone ? monthsUntilYm(plan.partnerA.milestoneDate, refDate) : null;
    const mileMonthB = (isCouple && plan.partnerB.hasMilestone) ? monthsUntilYm(plan.partnerB.milestoneDate, refDate) : null;
    let appliedA = false, appliedB = false;

    function updateCredit(m) {
      if (mileMonthA !== null && !appliedA && m >= Math.max(0, mileMonthA)) {
        ficoA = clamp(ficoA + Math.max(0, num(plan.partnerA.milestoneBoost, 50)), 300, 850);
        appliedA = true;
      }
      if (isCouple && mileMonthB !== null && !appliedB && m >= Math.max(0, mileMonthB)) {
        ficoB = clamp(ficoB + Math.max(0, num(plan.partnerB.milestoneBoost, 40)), 300, 850);
        appliedB = true;
      }
    }

    // Clone Goals
    const goals = (plan.goals || []).map((g, idx) => {
      const isHome = g.type === 'home';
      let targetCash = Math.max(0, num(g.targetAmount, 5000));
      if (isHome) {
        const prog = LOAN_PROGRAMS[g.loanProgram] || LOAN_PROGRAMS.fha;
        targetCash = Math.round(num(g.price, 325000) * ((prog.downPct + num(g.closingPct, 3)) / 100));
      }
      return {
        ...g,
        idx,
        isHome,
        targetCash,
        bucket: 0,
        prevBucket: 0,
        achievedExact: null,
        achievedDate: null,
        cashReadyExact: null,
        status: 'On Track',
        blocker: '',
        uw: null,
        borrowerComparison: null
      };
    });

    let unallocated = Math.max(0, num(plan.cash.liquid)) + lumpSum;
    let currentHousingCost = baseHousing;
    let activeMortgages = [];
    let rentReplaced = false;

    const debtStrategy = plan.debtStrategy || 'dti_optimizer';
    const allocMode = plan.allocationMode || 'waterfall';

    function sortDebts(list, forceDti = false) {
      const s = forceDti ? 'dti_optimizer' : debtStrategy;
      return [...list].sort((a, b) => {
        if (s === 'snowball') return a.balance - b.balance;
        if (s === 'avalanche') return (b.apr - a.apr) || (a.balance - b.balance);
        const ra = a.balance > 0 ? a.minPayment / a.balance : 0;
        const rb = b.balance > 0 ? b.minPayment / b.balance : 0;
        if (rb !== ra) return rb - ra;
        return b.apr - a.apr;
      });
    }

    function sweepDebts(pool, m, forceDti = false) {
      let rem = pool;
      for (const d of sortDebts(debts.filter(x => x.balance > 0.01), forceDti)) {
        if (rem <= 0.01) break;
        const before = d.balance;
        const pay = Math.min(d.balance, rem);
        d.balance = Math.max(0, d.balance - pay);
        rem -= pay;
        if (d.balance <= 0.01) {
          d.balance = 0;
          if (d.paidOffExact === null) {
            const frac = before > 0 ? clamp(before / Math.max(before, pay), 0.1, 1) : 0;
            d.paidOffExact = m === 0 ? 0 : (m - 1) + frac;
          }
        }
      }
      return rem;
    }

    function borrowerDebtsFor(mode) {
      let sum = 0;
      for (const d of debts) {
        if (d.balance <= 0.01) continue;
        if (mode === 'joint' || d.owner === 'joint' || d.owner === mode) sum += d.minPayment;
      }
      for (const mtg of activeMortgages) {
        if (mode === 'joint' || mtg.owner === 'joint' || mtg.owner === mode) sum += mtg.piti;
      }
      return sum;
    }

    function evalDualBorrowers(g) {
      const modes = isCouple ? ['joint', 'partnerA', 'partnerB'] : ['partnerA'];
      const list = modes.map(mode => {
        const gross = mode === 'joint' ? totalGross : (mode === 'partnerA' ? incA.grossMonthly : incB.grossMonthly);
        const dMins = borrowerDebtsFor(mode);
        const score = mode === 'joint' ? Math.min(ficoA, ficoB) : (mode === 'partnerA' ? ficoA : ficoB);
        const label = mode === 'joint' ? 'Joint Application' : (mode === 'partnerA' ? `${plan.partnerA.name} Solo` : `${plan.partnerB.name} Solo`);
        return { mode, label, ...evaluateMortgage(g, plan.household, gross, dMins, score) };
      });
      const forcedMode = isCouple ? (g.borrowerMode || 'auto') : 'partnerA';
      let chosen;
      if (forcedMode !== 'auto') {
        chosen = list.find(x => x.mode === forcedMode) || list[0];
      } else {
        const qual = list.filter(x => x.qualified);
        if (qual.length) {
          qual.sort((a, b) => a.totalPITI - b.totalPITI);
          chosen = qual[0];
        } else {
          const sorted = [...list].sort((a, b) => (b.usdaOk - a.usdaOk) || (b.ficoOk - a.ficoOk) || (a.backEndDti - b.backEndDti));
          chosen = sorted[0];
        }
      }
      return { chosen, all: list };
    }

    function checkGoalUnlocks(m) {
      let unlockedAny = false;
      for (const g of goals) {
        if (g.achievedExact !== null) continue;
        if (!g.isHome) {
          if (g.bucket >= g.targetCash - 0.5) {
            const gain = g.bucket - g.prevBucket;
            const frac = (m === 0 || gain <= 0.01) ? 0 : clamp((g.targetCash - g.prevBucket) / gain, 0.02, 1);
            g.achievedExact = m === 0 ? 0 : (m - 1) + frac;
            g.achievedDate = addMonthsDate(g.achievedExact, refDate);
            g.cashReadyExact = g.cashReadyExact ?? g.achievedExact;
            g.status = 'On Track';
            g.blocker = '';
            if (g.bucket > g.targetCash) {
              unallocated += (g.bucket - g.targetCash);
              g.bucket = g.targetCash;
            }
            unlockedAny = true;
          }
        } else {
          const res = evalDualBorrowers(g);
          g.uw = res.chosen;
          g.borrowerComparison = res.all;
          g.targetCash = Math.round(res.chosen.cashToClose);

          const cashOk = g.bucket >= res.chosen.cashToClose - 0.5;
          if (cashOk && g.cashReadyExact === null) {
            const gain = g.bucket - g.prevBucket;
            const frac = (m === 0 || gain <= 0.01) ? 0 : clamp((res.chosen.cashToClose - g.prevBucket) / gain, 0.02, 1);
            g.cashReadyExact = m === 0 ? 0 : (m - 1) + frac;
          }

          if (cashOk && res.chosen.qualified) {
            g.achievedExact = (g.cashReadyExact !== null && g.cashReadyExact < m - 1) ? m : (g.cashReadyExact ?? m);
            g.achievedDate = addMonthsDate(g.achievedExact, refDate);
            g.status = 'On Track';
            g.blocker = '';
            const leftover = Math.max(0, g.bucket - res.chosen.cashToClose);
            g.bucket = 0;
            unallocated += leftover;

            if (g.replaceRent !== false && !rentReplaced) {
              rentReplaced = true;
              currentHousingCost = 0;
            }
            activeMortgages.push({
              piti: res.chosen.totalPITI,
              pi: res.chosen.monthlyPI,
              balance: res.chosen.financedLoan,
              rate: num(g.rate, 6.5),
              owner: res.chosen.mode
            });
            unlockedAny = true;
          } else if (cashOk) {
            g.status = !res.chosen.usdaOk ? 'Area Blocked' : (!res.chosen.ficoOk ? 'Credit Wait' : 'DTI Blocked');
            g.blocker = res.chosen.blocker;
          }
        }
      }
      return unlockedAny;
    }

    function allocateSurplus(pool, m) {
      let rem = pool;
      if (rem <= 0.01) return 0;

      const activeDebts = debts.filter(d => d.balance > 0.01);
      const pendingGoals = goals.filter(g => g.achievedExact === null);

      if (allocMode === 'waterfall') {
        for (const g of pendingGoals.filter(x => x.type === 'emergency')) {
          if (rem <= 0.01) break;
          const need = Math.max(0, g.targetCash - g.bucket);
          const add = Math.min(rem, need);
          g.bucket += add; rem -= add;
        }
        const highApr = activeDebts.filter(d => d.apr >= 12);
        if (rem > 0.01 && highApr.length) {
          for (const d of sortDebts(highApr, false)) {
            if (rem <= 0.01) break;
            const pay = Math.min(d.balance, rem);
            d.balance = Math.max(0, d.balance - pay);
            rem -= pay;
            if (d.balance <= 0.01) { d.balance = 0; if (d.paidOffExact === null) d.paidOffExact = m; }
          }
        }
        for (const g of pendingGoals.filter(x => x.type !== 'emergency')) {
          if (rem <= 0.01) break;
          const need = Math.max(0, g.targetCash - g.bucket);
          if (need > 0.01) {
            const add = Math.min(rem, need);
            g.bucket += add; rem -= add;
          }
          if (rem > 0.01 && g.isHome && g.bucket >= g.targetCash - 0.5) {
            const check = evalDualBorrowers(g);
            if (!check.chosen.dtiOk && debts.some(d => d.balance > 0.01)) {
              rem = sweepDebts(rem, m, true);
            }
          }
        }
        if (rem > 0.01 && debts.some(d => d.balance > 0.01)) {
          rem = sweepDebts(rem, m, false);
        }
      } else {
        const buckets = pendingGoals
          .map(g => ({ kind: 'goal', g, w: Math.max(1, num(g.weight, 25)), need: Math.max(0, g.targetCash - g.bucket) }))
          .filter(b => b.need > 0.01);
        const dSum = activeDebts.reduce((s, d) => s + d.balance, 0);
        if (dSum > 0.01) buckets.push({ kind: 'debt', w: 25, need: dSum });

        for (let pass = 0; pass < 3 && rem > 0.5; pass++) {
          const live = buckets.filter(b => b.need > 0.01);
          if (!live.length) break;
          const totalW = live.reduce((s, b) => s + b.w, 0);
          let spent = 0;
          for (const b of live) {
            const share = Math.min(b.need, rem * (b.w / totalW));
            if (b.kind === 'goal') { b.g.bucket += share; spent += share; }
            else { const left = sweepDebts(share, m, false); spent += (share - left); }
            b.need -= share;
          }
          rem = Math.max(0, rem - spent);
        }
      }
      return rem;
    }

    function totalAccumulatedCash() {
      const doneCash = goals.reduce((s, g) => s + (g.achievedExact !== null ? g.targetCash : 0), 0);
      const activeBuckets = goals.reduce((s, g) => s + (g.achievedExact === null ? g.bucket : 0), 0);
      return doneCash + activeBuckets + unallocated;
    }

    // Month 0 initialization
    updateCredit(0);
    goals.forEach(g => { g.prevBucket = g.bucket; });
    unallocated = allocateSurplus(unallocated, 0);
    if (checkGoalUnlocks(0) && unallocated > 1) {
      unallocated = allocateSurplus(unallocated, 0);
      checkGoalUnlocks(0);
    }

    const series = [];
    const pushSnap = (m) => {
      const cash = totalAccumulatedCash();
      const debt = debts.reduce((s, d) => s + d.balance, 0);
      series.push({ month: m, cash, debt, netPos: cash - debt, ficoA: Math.round(ficoA), ficoB: Math.round(ficoB) });
    };
    pushSnap(0);

    for (let m = 1; m <= MAX_MONTHS; m++) {
      updateCredit(m);
      goals.forEach(g => { g.prevBucket = g.bucket; });

      unallocated *= (1 + mHysaRate);
      for (const g of goals) {
        if (g.bucket > 0 && g.achievedExact === null) {
          const rate = g.type === 'investment' ? (num(g.expectedApy, 7.5) / 100 / 12) : mHysaRate;
          g.bucket *= (1 + rate);
        }
      }

      let debtMinsPaid = 0;
      for (const d of debts) {
        if (d.balance <= 0.01) continue;
        const intr = d.balance * (d.apr / 100 / 12);
        d.balance += intr;
        d.interestPaid += intr;
        const before = d.balance;
        const pay = Math.min(d.balance, d.minPayment);
        d.balance = Math.max(0, d.balance - pay);
        debtMinsPaid += pay;
        if (d.balance <= 0.01) {
          d.balance = 0;
          if (d.paidOffExact === null) d.paidOffExact = (m - 1) + clamp(before / Math.max(before, pay), 0.1, 1);
        }
      }

      let mortPiti = 0;
      for (const mtg of activeMortgages) {
        mortPiti += mtg.piti;
        if (mtg.balance > 0) {
          const intr = mtg.balance * (mtg.rate / 100 / 12);
          mtg.balance = Math.max(0, mtg.balance - Math.max(0, mtg.pi - intr));
        }
      }

      const netFlow = totalNet - (currentHousingCost + nonHousingBills + effVariableLiving + effectiveLeakage + mortPiti + debtMinsPaid);
      if (netFlow < 0) unallocated = Math.max(0, unallocated + netFlow);
      else unallocated += netFlow;

      if (unallocated > 0.01) unallocated = allocateSurplus(unallocated, m);
      if (checkGoalUnlocks(m) && unallocated > 1) {
        unallocated = allocateSurplus(unallocated, m);
        checkGoalUnlocks(m);
      }

      pushSnap(m);

      const allDebtsDone = debts.every(d => d.balance <= 0.01);
      const allGoalsDone = goals.every(g => g.achievedExact !== null);
      if (allDebtsDone && allGoalsDone && m >= 18) {
        const lastM = Math.max(
          ...debts.map(d => Math.ceil(d.paidOffExact || 0)),
          ...goals.map(g => Math.ceil(g.achievedExact || 0)),
          12
        );
        if (m >= lastM + 6) break;
      }
    }

    for (const g of goals) {
      if (g.achievedExact !== null) continue;
      if (g.isHome) {
        const res = evalDualBorrowers(g);
        g.uw = res.chosen;
        g.borrowerComparison = res.all;
        if (g.bucket >= res.chosen.cashToClose - 0.5) {
          g.status = !res.chosen.usdaOk ? 'Area Blocked' : (!res.chosen.ficoOk ? 'Credit Wait' : 'DTI Blocked');
          g.blocker = res.chosen.blocker;
        } else {
          g.status = monthlySurplus <= 0 ? 'Cashflow Deficit' : 'Beyond 30 Yrs';
          g.blocker = monthlySurplus <= 0 ? `Deficit ${fmtMoney(monthlySurplus)}/mo` : 'Increase surplus to unlock';
        }
      } else {
        g.status = monthlySurplus <= 0 ? 'Cashflow Deficit' : 'Beyond 30 Yrs';
        g.blocker = monthlySurplus <= 0 ? `Deficit ${fmtMoney(monthlySurplus)}/mo` : 'Increase surplus to unlock';
      }
    }

    const debtFreeExact = debts.length === 0
      ? 0
      : (debts.some(d => d.paidOffExact === null) ? null : Math.max(...debts.map(d => d.paidOffExact || 0)));

    const primaryGoal = goals.find(g => g.isHome) || goals.find(g => g.achievedExact === null || g.achievedExact > 0) || goals[0] || null;

    return {
      isCouple,
      refDate,
      incA, incB, totalGross, totalNet,
      billSummary,
      variableLiving: effVariableLiving,
      coreExpenses: coreExpensesTotal,
      leakage: effectiveLeakage,
      initDebtTotal, initDebtMins,
      monthlySurplus,
      hysaApy,
      debts,
      debtFreeExact,
      debtFreeDate: debtFreeExact !== null ? addMonthsDate(debtFreeExact, refDate) : null,
      startFicoA: Math.round(num(plan.partnerA.fico, 660)),
      startFicoB: Math.round(num(plan.partnerB.fico, 690)),
      endFicoA: Math.round(ficoA),
      endFicoB: Math.round(ficoB),
      goals,
      primaryGoal,
      series
    };
  }

  function lockBaselineOnPlan(plan) {
    const now = new Date();
    const sim = runSimulation(plan, null, now);
    const pg = sim.primaryGoal;
    plan.baseline = {
      lockedAt: now.toISOString(),
      startCash: num(plan.cash.liquid),
      startDebt: sim.initDebtTotal,
      primaryGoalId: pg ? pg.id : null,
      primaryGoalName: pg ? pg.name : 'Primary Goal',
      primaryGoalExactMonths: pg ? pg.achievedExact : null,
      primaryGoalDateMs: (pg && pg.achievedDate) ? pg.achievedDate.getTime() : null,
      series: sim.series.map(pt => ({ month: pt.month, cash: pt.cash, debt: pt.debt, netPos: pt.netPos }))
    };
  }

  function computePaceVsBaseline(plan, liveSim) {
    const bl = plan.baseline;
    if (!bl || !bl.primaryGoalDateMs || !liveSim.primaryGoal || !liveSim.primaryGoal.achievedDate) {
      return { available: false, daysAhead: 0, label: 'Baseline Active', tone: 'cyan' };
    }
    const diffDays = Math.round((bl.primaryGoalDateMs - liveSim.primaryGoal.achievedDate.getTime()) / 86400000);
    if (Math.abs(diffDays) <= 2) return { available: true, daysAhead: 0, label: 'On Baseline', tone: 'cyan' };
    if (diffDays > 0) return { available: true, daysAhead: diffDays, label: `${diffDays} Days Ahead`, tone: 'emerald' };
    return { available: true, daysAhead: diffDays, label: `${Math.abs(diffDays)} Days Behind`, tone: 'amber' };
  }

  /* ==========================================================================
     5. STORAGE
     ========================================================================== */
  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.household && parsed.partnerA) {
          ui.plan = migratePlan(parsed);
          if (!ui.plan.baseline) lockBaselineOnPlan(ui.plan);
          ui.mode = 'app';
          return;
        }
      }
    } catch (e) {}
    ui.plan = null;
    ui.mode = 'welcome';
  }

  function savePlan() {
    if (!ui.plan) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ui.plan)); } catch (e) {}
  }

  function isWhatIfActive() {
    if (!ui.plan) return false;
    const w = ui.whatIf;
    const baseApy = num(ui.plan.cash.hysaApy, 4.25);
    return w.trimLeakage > 0 || w.incomeBoost > 0 || w.lumpSum > 0 || (w.hysaApy !== null && Math.abs(w.hysaApy - baseApy) > 0.01);
  }

          <div class="welcome-orb">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L15.6 12L12 22L8.4 12L12 2Z" fill="#04121F"/>
              <path d="M12 2L15.6 12H12V2Z" fill="#F0FDFA"/>
              <circle cx="12" cy="12" r="2.2" fill="#34D399"/>
            </svg>
          </div>
          <div>
            <span class="pill pill-cyan" style="margin-bottom:10px;">100% Private · Offline · Zero Bank Logins</span>
            <h1 style="font-size:28px;margin-top:4px;">Pathfinder OS</h1>
            <p style="font-size:14px;color:var(--text-2);margin-top:8px;max-width:440px;">
              Turn your paycheck, recurring bills, debts, credit, and goals into exact calendar dates — and stay on track every payday in 90 seconds.
            </p>
          </div>

          <button class="btn btn-cyan btn-full" style="font-size:15px;min-height:52px;margin-top:6px;" onclick="PF.startFreshWizard()">
            Start My Plan (6-Step Bubble Wizard)
          </button>

          <div style="width:100%;padding-top:10px;border-top:1px solid var(--glass-border);display:flex;flex-direction:column;gap:10px;">
            <span style="font-size:11.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">Or Explore a Preview Sample First</span>
            <div class="chip-group" style="justify-content:center;">
              <button class="chip-btn" onclick="PF.loadSample('single')">Alex — Single</button>
              <button class="chip-btn" onclick="PF.loadSample('couple')">Jordan &amp; Sam — Couple</button>
