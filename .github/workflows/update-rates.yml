name: Sync FRED Rates & Deploy Pages

on:
  schedule:
    # Every Thursday at 18:00 UTC (1 PM EST / 2 PM EDT) after Freddie Mac's weekly survey
    - cron: '0 18 * * 4'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest FRED mortgage & Treasury rates
        run: |
          python3 - << 'EOF'
          import csv, io, json, urllib.request
          from datetime import datetime, timezone

          SERIES = {
              "mortgage_30y": ("MORTGAGE30US", "30-Yr Fixed"),
              "mortgage_15y": ("MORTGAGE15US", "15-Yr Fixed"),
              "fha_30y":      ("OBMMIFHA30YF", "30-Yr FHA"),
              "treasury_10y": ("DGS10",        "10-Yr Treasury"),
          }

          try:
              with open("rates.json", "r", encoding="utf-8") as f:
                  existing = json.load(f)
          except Exception:
              existing = {"rates": {}}

          updated_rates = dict(existing.get("rates", {}))

          for key, (series_id, label) in SERIES.items():
              url = f"https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}"
              req = urllib.request.Request(url, headers={"User-Agent": "PathfinderOS-StaticSync/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      text = resp.read().decode("utf-8")
                  rows = list(csv.reader(io.StringIO(text)))
                  for row in reversed(rows[1:]):
                      if len(row) >= 2 and row[1].strip() not in ("", "."):
                          updated_rates[key] = {
                              "value": round(float(row[1]), 2),
                              "date": row[0].strip(),
                              "label": label,
                          }
                          break
              except Exception as err:
                  print(f"Warning: kept cached value for {series_id}: {err}")

          payload = {
              "updated_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source": "FRED (Federal Reserve Bank of St. Louis)",
              "rates": updated_rates,
          }

          with open("rates.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          EOF

      - name: Commit updated rates.json if changed
        run: |
          if ! git diff --quiet rates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "data: sync weekly FRED mortgage rates"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
